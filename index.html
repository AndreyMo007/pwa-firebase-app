function initGrid(isPvP){grid.length=0;for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<COLS;c++){grid[r][c]={color:r<3?'#ff4444':'#4488ff',unit:null,hp:0,maxHp:0,damage:0,attackRange:0,heal:0,hasMovedThisRound:false,cardData:null}}}if(!isPvP){for(let r=0;r<3;r++)for(let c=0;c<COLS;c++){grid[r][c].unit='👾';grid[r][c].hp=8;grid[r][c].maxHp=8;grid[r][c].heal=1;grid[r][c].cardData={name:'Миньон',emoji:'👾',hp:8,maxHp:8}}}}
function shuffleArray(a){const s=[...a];for(let i=s.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]]}return s}
function renderCards(){const aR=document.getElementById('available-cards'),pR=document.getElementById('purchased-cards');if(!aR||!pR)return;aR.innerHTML='';for(let i=0;i<5;i++){const s=document.createElement('div');s.className='card-slot';if(availableCards[i]){const c=availableCards[i];s.innerHTML='<span class="card-emoji">'+c.emoji+'</span><span class="card-name">'+c.name+'</span><span class="card-cost">'+c.cost+'</span>';const b=document.createElement('button');b.className='buy-btn';b.textContent='КУПИТЬ';b.onclick=e=>{e.stopPropagation();buyCard(i)};s.appendChild(b)}else s.classList.add('empty');aR.appendChild(s)}pR.innerHTML='';for(let i=0;i<5;i++){const s=document.createElement('div');s.className='card-slot';if(i<purchasedCards.length){const c=purchasedCards[i];s.classList.add('purchased');s.innerHTML='<span class="card-emoji">'+c.emoji+'</span><span class="card-name">'+c.name+'</span>';s.onclick=()=>{if(gamePhase==='placement'){selectedPurchasedCard={index:i,card:c};placementHighlights=[];for(let r=3;r<6;r++)for(let cl=0;cl<COLS;cl++)if(!grid[r][cl].unit)placementHighlights.push({row:r,col:cl,color:'rgba(50,255,50,0.4)',text:''})}}}else s.classList.add('empty');pR.appendChild(s)}}
function buyCard(i){if(gamePhase!=='placement'||!availableCards[i])return;const c=availableCards[i];if(elixir<c.cost)return;elixir-=c.cost;purchasedCards.push({...c});availableCards[i]=null;updateElixirDisplay();renderCards();if(currentMode==='pvp')saveMyField();}
function updateElixirDisplay(){const e=document.getElementById('elixir-display');if(e)e.textContent='💜 '+elixir}
function updatePhaseDisplay(){const e=document.getElementById('game-phase');if(!e)return;e.textContent=gamePhase==='placement'?'РАССТАНОВКА':isPlayerTurn?'ВАШ ХОД':'ХОД ПРОТИВНИКА'}
function resizeCanvas(){const cont=document.getElementById('game-container'),ca=document.getElementById('cards-area');if(!cont||!ca)return;const rect=cont.getBoundingClientRect();if(rect.width===0||rect.height===0){requestAnimationFrame(resizeCanvas);return}const ch=ca.offsetHeight||120,ah=rect.height-38-ch;canvas.width=rect.width;canvas.height=Math.max(180,ah);const gapBetween=10,gapEdge=10,totalGap=gapBetween*(COLS-1)+gapEdge*2,maxW=(canvas.width-totalGap)/COLS,maxH=(canvas.height-totalGap)/ROWS;cellSize=Math.floor(Math.min(maxW,maxH));gridOffsetX=Math.floor((canvas.width-cellSize*COLS-gapBetween*(COLS-1))/2);gridOffsetY=Math.floor((canvas.height-cellSize*ROWS-gapBetween*(ROWS-1))/2);}
function calculateHighlights(row,col){const hl=[],cell=grid[row][col];if(!cell||!cell.unit)return hl;const dir=-1;for(let r=1;r<=cell.attackRange;r++){const tr=row+dir*r;if(tr<0||tr>=ROWS)break;for(let c=Math.max(0,col-1);c<=Math.min(COLS-1,col+1);c++){const tc=grid[tr]?grid[tr][c]:null;if(!tc)continue;if(tc.unit){if(tr<3&&cell.damage>0)hl.push({row:tr,col:c,color:'rgba(255,40,40,0.6)',text:'-'+cell.damage});else if(tr>=3)hl.push({row:tr,col:c,color:'rgba(255,255,0,0.5)',text:''})}else hl.push({row:tr,col:c,color:'rgba(255,255,0,0.3)',text:''})}}if(cell.heal>0)for(let r=1;r<=cell.attackRange;r++){const tr=row+dir*r;if(tr<0||tr>=ROWS)break;for(let c=Math.max(0,col-1);c<=Math.min(COLS-1,col+1);c++){const tc=grid[tr]?grid[tr][c]:null;if(tc&&tc.unit&&tr>=3)hl.push({row:tr,col:c,color:'rgba(50,100,255,0.6)',text:'+'+cell.heal})}}return hl;}
function drawGrid(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#0d1117';ctx.fillRect(0,0,canvas.width,canvas.height);const cr=cellSize*0.1,gapBetween=10;for(let r=0;r<ROWS;r++){for(let c=0;c<COLS;c++){if(!grid[r]||!grid[r][c])continue;const x=gridOffsetX+c*(cellSize+gapBetween),y=gridOffsetY+r*(cellSize+gapBetween),cell=grid[r][c];ctx.fillStyle=cell.color;ctx.beginPath();ctx.roundRect(x,y,cellSize,cellSize,cr);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x+1,y+1,cellSize-2,cellSize-2,cr);ctx.stroke();if(r===selectedUnitRow&&c===selectedUnitCol){ctx.fillStyle='rgba(255,215,0,0.3)';ctx.beginPath();ctx.roundRect(x+1,y+1,cellSize-2,cellSize-2,cr);ctx.fill();ctx.strokeStyle='#ffd700';ctx.lineWidth=3;ctx.stroke()}if(cell.unit&&!cell.hasMovedThisRound&&gamePhase==='playerTurn'){ctx.fillStyle='rgba(255,255,100,0.3)';ctx.beginPath();ctx.roundRect(x+1,y+1,cellSize-2,cellSize-2,cr);ctx.fill()}if(cell.unit){ctx.fillStyle='#fff';ctx.font=(cellSize*0.35)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(cell.unit,x+cellSize/2,y+cellSize/2-cellSize*0.1);const bw=cellSize*0.75,bh=4,bx=x+(cellSize-bw)/2,by=y+cellSize-7;ctx.fillStyle='#333';ctx.fillRect(bx,by,bw,bh);const pct=cell.hp/cell.maxHp;ctx.fillStyle=pct>0.5?'#4caf50':pct>0.25?'#ff9800':'#f44336';ctx.fillRect(bx,by,bw*pct,bh);ctx.fillStyle='#fff';ctx.font='bold '+Math.max(6,cellSize*0.16)+'px Arial';ctx.textAlign='center';ctx.fillText(Math.ceil(cell.hp)+'/'+cell.maxHp,x+cellSize/2,y+cellSize-10)}}}placementHighlights.forEach(h=>{const x=gridOffsetX+h.col*(cellSize+gapBetween),y=gridOffsetY+h.row*(cellSize+gapBetween);ctx.fillStyle=h.color;ctx.beginPath();ctx.roundRect(x+2,y+2,cellSize-4,cellSize-4,cr);ctx.fill();ctx.strokeStyle='rgba(50,255,50,0.8)';ctx.lineWidth=2;ctx.stroke()});highlightedCells.forEach(h=>{const x=gridOffsetX+h.col*(cellSize+gapBetween),y=gridOffsetY+h.row*(cellSize+gapBetween);ctx.fillStyle=h.color;ctx.beginPath();ctx.roundRect(x+2,y+2,cellSize-4,cellSize-4,cr);ctx.fill();ctx.strokeStyle=h.color.replace('0.6','0.9').replace('0.5','0.8').replace('0.3','0.6');ctx.lineWidth=2;ctx.stroke();if(h.text){ctx.fillStyle='#fff';ctx.font='bold '+Math.max(12,cellSize*0.35)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeText(h.text,x+cellSize/2,y+cellSize/2);ctx.fillText(h.text,x+cellSize/2,y+cellSize/2)}});}
function unitAttack(row,col){const cell=grid[row][col];if(!cell.unit||cell.damage<=0)return;const dir=-1;let targetFound=false;for(let r=1;r<=cell.attackRange;r++){const tr=row+dir*r;if(tr<0||tr>=ROWS)break;const tc=grid[tr][col];if(tc&&tc.unit){tc.hp-=cell.damage;targetFound=true;if(tc.hp<=0){tc.unit=null;tc.hp=0;tc.cardData=null}break}}if(currentMode==='pvp'){saveMyField();syncAttack(row,col);}}
function checkMoves(){let pm=0,em=0;for(let r=3;r<6;r++)for(let c=0;c<COLS;c++)if(grid[r]&&grid[r][c]&&grid[r][c].unit&&!grid[r][c].hasMovedThisRound)pm++;for(let r=0;r<3;r++)for(let c=0;c<COLS;c++)if(grid[r]&&grid[r][c]&&grid[r][c].unit&&!grid[r][c].hasMovedThisRound)em++;return{playerMoves:pm,enemyMoves:em}}

// ====== НЕ СБРАСЫВАЕМ HP ПРИ РАССТАНОВКЕ ======
function startPlacementPhase(){
  gamePhase='placement';isPlayerTurn=false;elixir=Math.min(MAX_ELIXIR,elixir+5);
  selectedUnitRow=-1;selectedUnitCol=-1;highlightedCells=[];placementHighlights=[];
  updateElixirDisplay();updatePhaseDisplay();
  // Только сбрасываем флаги ходов, НЕ трогаем HP
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r]&&grid[r][c])grid[r][c].hasMovedThisRound=false;
  availableCards=shuffleArray(ALL_CARDS).slice(0,5);purchasedCards=[];selectedPurchasedCard=null;renderCards();
  timerSeconds=20;document.getElementById('game-timer').textContent=timerSeconds;
  if(timerInterval)clearInterval(timerInterval);
  timerInterval=setInterval(()=>{timerSeconds--;document.getElementById('game-timer').textContent=timerSeconds;if(timerSeconds<=0){clearInterval(timerInterval);startBattlePhase();}},1000);
  if(currentMode==='pvp')syncStateToFB();
  console.log('🔄 Расстановка! Эликсир:',elixir,'HP юнитов сохранены');
}

function startBattlePhase(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}gamePhase='playerTurn';const{playerMoves,enemyMoves}=checkMoves();if(currentMode==='pvp'){if(pvpIsHost){isPlayerTurn=playerMoves>0&&(Math.random()<0.5||enemyMoves===0);}else{isPlayerTurn=false;}}else{isPlayerTurn=playerMoves>0&&(Math.random()<0.5||enemyMoves===0);}selectedUnitRow=-1;selectedUnitCol=-1;highlightedCells=[];placementHighlights=[];updatePhaseDisplay();document.getElementById('game-timer').textContent='';console.log('⚔️ Битва! Мой ход:',isPlayerTurn,'Ходов: игрок='+playerMoves+' враг='+enemyMoves);if(currentMode==='pvp')syncStateToFB();}
function processTurn(){const{playerMoves,enemyMoves}=checkMoves();console.log('🔄 Ходы: игрок='+playerMoves+' враг='+enemyMoves+' сейчас ходит:',isPlayerTurn?'игрок':'враг');if(playerMoves===0&&enemyMoves===0){console.log('📋 У обоих 0 ходов! Расстановка.');startPlacementPhase();return;}if(isPlayerTurn&&playerMoves===0){if(enemyMoves>0){console.log('⏭️ Игроку нечем ходить, ход врагу ('+enemyMoves+' ходов)');isPlayerTurn=false;updatePhaseDisplay();if(currentMode==='pvp')syncStateToFB();return;}else{startPlacementPhase();return;}}if(!isPlayerTurn&&enemyMoves===0){if(playerMoves>0){console.log('⏭️ Врагу нечем ходить, ход игроку ('+playerMoves+' ходов)');isPlayerTurn=true;updatePhaseDisplay();if(currentMode==='pvp')syncStateToFB();return;}else{startPlacementPhase();return;}}isPlayerTurn=!isPlayerTurn;updatePhaseDisplay();console.log('🔁 Ход переключён. Мой ход:',isPlayerTurn);if(currentMode==='pvp')syncStateToFB();}
function gameLoop(){drawGrid();gameLoopId=requestAnimationFrame(gameLoop)}
function showLobby(){lobby.classList.add('active');lobby.style.display='flex'}

// ====== PVP СИНХРОНИЗАЦИЯ ======
function saveMyField(){if(!pvpRoom)return;const myField=[[],[],[]];for(let r=3;r<6;r++){for(let c=0;c<COLS;c++){const cell=grid[r][c];myField[r-3][c]=cell.unit?{u:cell.unit,h:cell.hp,mh:cell.maxHp,d:cell.damage,ar:cell.attackRange,hm:cell.hasMovedThisRound}:null}}set(ref(db,'pvp_fields/'+pvpRoom+'/'+playerId),myField);console.log('📤 Поле сохранено');}
function syncStateToFB(){if(!pvpRoom)return;set(ref(db,'rooms/'+pvpRoom+'/state'),{phase:gamePhase,isPlayerTurn:isPlayerTurn,currentPlayer:isPlayerTurn?playerId:pvpOpponentId});console.log('📤 Состояние: фаза='+gamePhase+' ход='+(isPlayerTurn?'мой':'противника'));}
function watchOpponentField(){if(!pvpRoom||!pvpOpponentId)return;console.log('👀 Слушаю поле оппонента:',pvpOpponentId);onValue(ref(db,'pvp_fields/'+pvpRoom+'/'+pvpOpponentId),(snap)=>{const oppField=snap.val();if(!oppField){console.log('❌ Поле оппонента пустое');return;}console.log('📥 Получено поле оппонента');for(let r=0;r<3;r++){if(!oppField[r])continue;for(let c=0;c<COLS;c++){let tr=2-r,tc=3-c;if(oppField[r][c]&&oppField[r][c].u){grid[tr][tc].unit=oppField[r][c].u;grid[tr][tc].hp=oppField[r][c].h;grid[tr][tc].maxHp=oppField[r][c].mh;grid[tr][tc].damage=oppField[r][c].d||0;grid[tr][tc].attackRange=oppField[r][c].ar||1;grid[tr][tc].hasMovedThisRound=oppField[r][c].hm||false;grid[tr][tc].cardData={name:oppField[r][c].u,emoji:oppField[r][c].u};}else{grid[tr][tc].unit=null;grid[tr][tc].hp=0;grid[tr][tc].cardData=null;}}}});}
function watchGameState(){if(!pvpRoom)return;onValue(ref(db,'rooms/'+pvpRoom+'/state'),(snap)=>{const s=snap.val();if(!s)return;console.log('📥 Состояние: фаза='+s.phase+' current='+s.currentPlayer+' я='+playerId);if(s.currentPlayer===playerId){gamePhase=s.phase;isPlayerTurn=true;updatePhaseDisplay();console.log('✅ Мой ход!');}else{gamePhase=s.phase;isPlayerTurn=false;updatePhaseDisplay();console.log('⏳ Ход противника');}});}

// ====== ОТПРАВКА АТАКИ (БЕЗ ЗЕРКАЛИРОВАНИЯ) ======
function syncAttack(row,col){
  if(!pvpRoom)return;
  const cell=grid[row][col];
  if(!cell.unit)return;
  console.log('⚔️ Отправка атаки: атакующий на ('+row+','+col+') урон='+cell.damage+' дальность='+cell.attackRange);
  set(ref(db,'rooms/'+pvpRoom+'/attack'),{
    attackerRow:row,
    attackerCol:col,
    damage:cell.damage,
    attackRange:cell.attackRange,
    time:Date.now()
  });
}

// ====== ПОЛУЧЕНИЕ АТАКИ (БЕЗ ЗЕРКАЛИРОВАНИЯ) ======
// ====== ПОЛУЧЕНИЕ АТАКИ ПРОТИВНИКА (ЗЕРКАЛИРОВАНИЕ КАК У ЮНИТОВ) ======
function watchOpponentAttack(){
  if(!pvpRoom)return;
  onValue(ref(db,'rooms/'+pvpRoom+'/attack'),(snap)=>{
    const a=snap.val();if(!a||Date.now()-a.time>2000)return;
    console.log('⚔️ Атака противника! Атакующий на ('+a.attackerRow+','+a.attackerCol+')');
    
    // Точно такое же зеркалирование как у юнитов в watchOpponentField():
    // tr = 2 - r  (переворот по вертикали)
    // tc = 3 - c  (переворот по горизонтали)
    let showRow = 2 - a.attackerRow;
    let showCol = 3 - a.attackerCol;
    
    console.log('🪞 Зеркальная позиция атаки: ('+showRow+','+showCol+')');
    
    // Временно подменяем клетку для calculateHighlights
    const origCell = grid[showRow] ? (grid[showRow][showCol] ? {...grid[showRow][showCol]} : null) : null;
    if(grid[showRow] && grid[showRow][showCol]){
      grid[showRow][showCol].unit = grid[showRow][showCol].unit || '?';
      grid[showRow][showCol].damage = a.damage;
      grid[showRow][showCol].attackRange = a.attackRange;
      grid[showRow][showCol].heal = 0;
    }
    
    highlightedCells = calculateHighlights(showRow, showCol);
    
    // Восстанавливаем оригинальную клетку
    if(origCell && grid[showRow] && grid[showRow][showCol]){
      grid[showRow][showCol] = {...origCell};
    } else if(grid[showRow] && grid[showRow][showCol] && !origCell){
      grid[showRow][showCol].unit = null;
      grid[showRow][showCol].hp = 0;
      grid[showRow][showCol].cardData = null;
    }
    
    console.log('🎯 Подсвечено клеток:', highlightedCells.length);
    setTimeout(()=>{highlightedCells=[];},1500);
  });
}

function startPvP(){document.getElementById('pvp-waiting').classList.add('active');let resolved=false;console.log('🔍 Поиск PvP. Мой ID:',playerId);const unsubSignal=onValue(ref(db,'pvp_signals/'+playerId),(snap)=>{if(resolved||pvpRoom)return;const sig=snap.val();if(sig&&sig.roomId){resolved=true;pvpRoom=sig.roomId;pvpOpponentId=sig.hostId;pvpIsHost=false;console.log('🎮 ГОСТЬ! Комната:',pvpRoom,'Хост:',pvpOpponentId);remove(ref(db,'pvp_signals/'+playerId));remove(ref(db,'pvp_queue/'+playerId));unsubSignal();initGrid(true);document.getElementById('pvp-waiting').classList.remove('active');startGame();setTimeout(()=>{watchOpponentField();watchGameState();watchOpponentAttack();},500);}});set(ref(db,'pvp_queue/'+playerId),{playerId:playerId,time:Date.now()});console.log('✅ В очереди');setTimeout(()=>{if(resolved||pvpRoom)return;const unsubQueue=onValue(ref(db,'pvp_queue'),(snap)=>{if(resolved||pvpRoom)return;const data=snap.val();if(!data)return;const others=Object.entries(data).filter(([key])=>key!==playerId);console.log('📋 Другие в очереди:',others.length);if(others.length>0){resolved=true;const[oppKey]=others[0];pvpRoom='room_'+Date.now();pvpOpponentId=oppKey;pvpIsHost=true;console.log('🎮 ХОСТ! Комната:',pvpRoom,'Гость:',pvpOpponentId);remove(ref(db,'pvp_queue/'+playerId));remove(ref(db,'pvp_queue/'+oppKey));unsubQueue();initGrid(true);set(ref(db,'pvp_signals/'+oppKey),{roomId:pvpRoom,hostId:playerId});console.log('📤 Сигнал гостю');document.getElementById('pvp-waiting').classList.remove('active');startGame();setTimeout(()=>{watchOpponentField();watchGameState();watchOpponentAttack();},500);}});},2000);setTimeout(()=>{if(!resolved&&document.getElementById('pvp-waiting').classList.contains('active')){console.log('⏰ Таймаут');remove(ref(db,'pvp_queue/'+playerId));remove(ref(db,'pvp_signals/'+playerId));document.getElementById('pvp-waiting').classList.remove('active');alert('Соперник не найден');}},30000);}
function startGame(){lobby.style.display='none';lobby.classList.remove('active');gameScreen.classList.add('active');elixir=10;selectedUnitRow=-1;selectedUnitCol=-1;highlightedCells=[];placementHighlights=[];startPlacementPhase();setTimeout(resizeCanvas,300);if(gameLoopId)cancelAnimationFrame(gameLoopId);gameLoop();}

document.getElementById('play-button').onclick=()=>{if(currentMode==='classic'){initGrid(false);startGame();}else startPvP();};
document.getElementById('mode-button').onclick=()=>{document.getElementById('mode-modal').classList.add('active');};
document.getElementById('mode-classic').onclick=()=>{currentMode='classic';document.getElementById('mode-modal').classList.remove('active');document.getElementById('mode-button').textContent='⚔️ КЛАССИКА';};
document.getElementById('mode-pvp').onclick=()=>{currentMode='pvp';document.getElementById('mode-modal').classList.remove('active');document.getElementById('mode-button').textContent='👥 PvP';};
document.getElementById('mode-close').onclick=()=>{document.getElementById('mode-modal').classList.remove('active');};
document.getElementById('pvp-cancel').onclick=()=>{remove(ref(db,'pvp_queue/'+playerId));remove(ref(db,'pvp_signals/'+playerId));document.getElementById('pvp-waiting').classList.remove('active');};
document.getElementById('back-button').onclick=()=>{if(timerInterval)clearInterval(timerInterval);if(gameLoopId)cancelAnimationFrame(gameLoopId);if(pvpRoom){remove(ref(db,'pvp_fields/'+pvpRoom));remove(ref(db,'rooms/'+pvpRoom));}gameScreen.classList.remove('active');showLobby();};
document.getElementById('nav-home').onclick=()=>{document.getElementById('home-page').style.display='flex';document.getElementById('cards-page').classList.remove('active');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.getElementById('nav-home').classList.add('active');};
document.getElementById('nav-cards').onclick=()=>{document.getElementById('home-page').style.display='none';document.getElementById('cards-page').classList.add('active');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.getElementById('nav-cards').classList.add('active');renderAllCardsPage();};

canvas.onclick=e=>{if(!gameScreen.classList.contains('active'))return;const rect=canvas.getBoundingClientRect();if(rect.width===0)return;const mx=e.clientX-rect.left,my=e.clientY-rect.top,gapBetween=10;const col=Math.floor((mx-gridOffsetX)/(cellSize+gapBetween)),row=Math.floor((my-gridOffsetY)/(cellSize+gapBetween));if(col<0||col>=COLS||row<0||row>=ROWS){if(gamePhase==='playerTurn'){selectedUnitRow=-1;selectedUnitCol=-1;highlightedCells=[];}return;}if(gamePhase==='placement'){if(row>=3&&selectedPurchasedCard&&!grid[row][col].unit){const card=selectedPurchasedCard.card;grid[row][col].unit=card.emoji;grid[row][col].hp=card.hp;grid[row][col].maxHp=card.maxHp;grid[row][col].damage=card.damage;grid[row][col].attackRange=card.attackRange;grid[row][col].heal=card.heal||0;grid[row][col].cardData=card;purchasedCards.splice(selectedPurchasedCard.index,1);selectedPurchasedCard=null;placementHighlights=[];renderCards();if(currentMode==='pvp')saveMyField();}}else if(gamePhase==='playerTurn'&&isPlayerTurn){const cell=grid[row][col];if(row>=3&&cell&&cell.unit&&!cell.hasMovedThisRound){if(selectedUnitRow===row&&selectedUnitCol===col){cell.hasMovedThisRound=true;unitAttack(row,col);selectedUnitRow=-1;selectedUnitCol=-1;highlightedCells=[];processTurn();}else{selectedUnitRow=row;selectedUnitCol=col;highlightedCells=calculateHighlights(row,col);}}else{selectedUnitRow=-1;selectedUnitCol=-1;highlightedCells=[];}}};

document.getElementById('menu-toggle').onclick=()=>{const m=document.getElementById('settings-menu'),o=document.getElementById('settings-overlay'),t=document.getElementById('menu-toggle');m.classList.toggle('active');o.classList.toggle('active');t.classList.toggle('active');};
document.getElementById('settings-overlay').onclick=()=>{document.getElementById('settings-menu').classList.remove('active');document.getElementById('settings-overlay').classList.remove('active');document.getElementById('menu-toggle').classList.remove('active');};
window.addEventListener('resize',()=>{if(gameScreen.classList.contains('active'))resizeCanvas();});
window.addEventListener('orientationchange',()=>{if(gameScreen.classList.contains('active'))setTimeout(resizeCanvas,500);});

let progress=0;const loadInterval=setInterval(()=>{progress+=Math.random()*15;if(progress>=100){progress=100;clearInterval(loadInterval);setTimeout(()=>{preloader.classList.add('hidden');setTimeout(()=>{preloader.style.display='none';showLobby();},800);},500);}loadingBar.style.width=Math.floor(progress)+'%';loadingPercentage.textContent=Math.floor(progress)+'%';},300);
</script>
