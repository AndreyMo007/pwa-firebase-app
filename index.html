const imageCache = new Map();
function loadImage(src) {
  if (!src) return null;
  if (imageCache.has(src)) return imageCache.get(src);
  const img = new Image();
  img.crossOrigin = 'anonymous';
  const rec = { img, loaded: false, failed: false };
  img.onload = () => { rec.loaded = true; };
  img.onerror = () => { rec.failed = true; };
  img.src = src;
  imageCache.set(src, rec);
  return rec;
}

  ALL_CARDS.forEach(c => c.image && loadImage(c.image));

/* ================= СЕТКА ================= */
function makeEmptyCell(isTopHalf) {
  return {
    color: isTopHalf ? '#ff4444' : '#4488ff',
    unit: null, owner: null, hp: 0, maxHp: 0, damage: 0,
    attackRange: 0, heal: 0, hasMovedThisRound: false, cardData: null
  };
}

function initGrid(isPvP) {
  grid.length = 0;
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) grid[r][c] = makeEmptyCell(r < 3);
  }
  if (!isPvP) {
    const hpB = enemyHero ? (enemyHero.bonusHp || 0) : 0;
    const dmgB = enemyHero ? (enemyHero.bonusDmg || 0) : 0;
    for (let r = 0; r < 3; r++) for (let c = 0; c < COLS; c++) {
      grid[r][c].unit = '👾';
      grid[r][c].owner = 'enemy';
      grid[r][c].hp = 8 + hpB;
      grid[r][c].maxHp = 8 + hpB;
      grid[r][c].damage = 2 + dmgB;
      grid[r][c].attackRange = 1;
      grid[r][c].cardData = { id: 'minion', name: 'Миньон', emoji: '👾', image: null, hp: 8 + hpB, maxHp: 8 + hpB, damage: 2 + dmgB, attackRange: 1 };
    }
  }
}

function shuffleArray(a) {
  const s = [...a];
  for (let i = s.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [s[i], s[j]] = [s[j], s[i]];
  }
  return s;
}

function countUnitsInRows(sR, eR) {
  let n = 0;
  for (let r = sR; r < eR; r++) for (let c = 0; c < COLS; c++)
    if (grid[r] && grid[r][c] && grid[r][c].unit) n++;
  return n;
}
function countMovableInRows(sR, eR) {
  let n = 0;
  for (let r = sR; r < eR; r++) for (let c = 0; c < COLS; c++)
    if (grid[r] && grid[r][c] && grid[r][c].unit && !grid[r][c].hasMovedThisRound) n++;
  return n;
}

function clearCell(row, col) {
  const cell = grid[row] && grid[row][col];
  if (!cell) return;
  cell.unit = null; cell.owner = null; cell.hp = 0; cell.maxHp = 0;
  cell.damage = 0; cell.attackRange = 0; cell.heal = 0;
  cell.cardData = null; cell.hasMovedThisRound = false;
}

function dirForOwner(owner) { return owner === 'player' ? -1 : 1; }

/* Впереди кто-то — движения нет (ни ally, ни enemy) */
function getMoveTarget(row, col) {
  const cell = grid[row] && grid[row][col];
  if (!cell || !cell.unit || !cell.owner) return null;
  const tr = row + dirForOwner(cell.owner);
  if (tr < 0 || tr >= ROWS) return null;
  const t = grid[tr] && grid[tr][col];
  if (!t) return null;
  if (t.unit) return null;
  return { row: tr, col };
}

function canAttackBase(row, col) {
  const cell = grid[row] && grid[row][col];
  if (!cell || !cell.unit || !cell.owner || cell.damage <= 0) return false;
  if (cell.owner === 'player') return row === 0;
  return row === ROWS - 1;
}

function findAttackTarget(row, col) {
  const cell = grid[row] && grid[row][col];
  if (!cell || !cell.unit || !cell.owner || cell.damage <= 0) return null;
  const dir = dirForOwner(cell.owner);
  for (let r = 1; r <= cell.attackRange; r++) {
    const tr = row + dir * r;
    if (tr < 0 || tr >= ROWS) break;
    for (let c = Math.max(0, col - 1); c <= Math.min(COLS - 1, col + 1); c++) {
      const tc = grid[tr] && grid[tr][c];
      if (!tc || !tc.unit) continue;
      if (tc.owner === cell.owner) continue;
      return { row: tr, col: c };
    }
  }
  return null;
}

function moveUnit(row, col) {
  const cell = grid[row] && grid[row][col];
  if (!cell || !cell.unit) return false;
  const dest = getMoveTarget(row, col);
  if (!dest) return false;
  const t = grid[dest.row][dest.col];
  if (!t || t.unit) return false;
  t.unit = cell.unit;
  t.owner = cell.owner;
  t.hp = cell.hp;
  t.maxHp = cell.maxHp;
  t.damage = cell.damage;
  t.attackRange = cell.attackRange;
  t.heal = cell.heal;
  t.cardData = cell.cardData;
  t.hasMovedThisRound = true;
  clearCell(row, col);
  return true;
}

/* ================= КАРТЫ В БОЮ ================= */
function renderCards() {
  const aR = document.getElementById('available-cards');
  const pR = document.getElementById('purchased-cards');
  if (!aR || !pR) return;

  aR.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('div');
    s.className = 'card-slot';
    if (availableCards[i]) {
      const c = availableCards[i];
      const inner = c.image
        ? '<img class="slot-img" src="' + c.image + '" onerror="this.style.display=\'none\';this.parentNode.insertAdjacentHTML(\'afterbegin\',\'<span class=&quot;slot-emoji&quot;>' + c.emoji + '</span>\');">'
        : '<span class="slot-emoji">' + c.emoji + '</span>';
      s.innerHTML = inner + '<span class="card-name">' + c.name + '</span><span class="card-cost">' + c.cost + '</span>';
      const b = document.createElement('button');
      b.className = 'buy-btn';
      b.textContent = 'КУПИТЬ';
      b.onclick = e => { e.stopPropagation(); buyCard(i); };
      s.appendChild(b);
    } else s.classList.add('empty');
    aR.appendChild(s);
  }

  pR.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('div');
    s.className = 'card-slot';
    if (i < purchasedCards.length) {
      const c = purchasedCards[i];
      s.classList.add('purchased');
      const inner = c.image
        ? '<img class="slot-img" src="' + c.image + '" onerror="this.style.display=\'none\';this.parentNode.insertAdjacentHTML(\'afterbegin\',\'<span class=&quot;slot-emoji&quot;>' + c.emoji + '</span>\');">'
        : '<span class="slot-emoji">' + c.emoji + '</span>';
      s.innerHTML = inner + '<span class="card-name">' + c.name + '</span>';
      s.onclick = () => {
        if (gamePhase === 'placement') {
          selectedPurchasedCard = { index: i, card: c };
          placementHighlights = [];
          for (let r = 3; r < 6; r++) for (let cl = 0; cl < COLS; cl++)
            if (!grid[r][cl].unit)
              placementHighlights.push({ row: r, col: cl, color: 'rgba(50,255,50,0.4)', text: '' });
        }
      };
    } else s.classList.add('empty');
    pR.appendChild(s);
  }
}

function buyCard(i) {
  if (gamePhase !== 'placement' || !availableCards[i]) return;
  const c = availableCards[i];
  if (elixir < c.cost) return;
  elixir -= c.cost;
  purchasedCards.push({ ...c });
  availableCards[i] = null;
  updateElixirDisplay();
  renderCards();
  if (currentMode === 'pvp') saveMyField();
}

function updateElixirDisplay() {
  const e = document.getElementById('elixir-display');
  if (e) e.textContent = '💜 ' + elixir;
}

function updatePhaseDisplay() {
  const e = document.getElementById('game-phase');
  if (!e) return;
  if (gamePhase === 'placement') e.textContent = 'РАССТАНОВКА';
  else if (gamePhase === 'playerTurn') {
    if (isPlayerTurn) e.textContent = lastTurnFlag ? 'ПОСЛЕДНИЙ ХОД' : 'ВАШ ХОД';
    else e.textContent = 'ХОД ПРОТИВНИКА';
  } else e.textContent = gamePhase;
}

/* ================= ПОДСВЕТКА ================= */
function calculateHighlights(row, col) {
  const hl = [];
  const cell = grid[row] && grid[row][col];
  if (!cell || !cell.unit || !cell.owner) return hl;
  const dir = dirForOwner(cell.owner);
  for (let r = 1; r <= cell.attackRange; r++) {
    const tr = row + dir * r;
    if (tr < 0 || tr >= ROWS) break;
    for (let c = Math.max(0, col - 1); c <= Math.min(COLS - 1, col + 1); c++) {
      const tc = grid[tr] && grid[tr][c];
      if (!tc) continue;
      if (tc.unit) {
        if (tc.owner !== cell.owner && cell.damage > 0)
          hl.push({ row: tr, col: c, color: 'rgba(255,40,40,0.55)', text: '-' + cell.damage });
        else if (tc.owner === cell.owner && cell.heal > 0)
          hl.push({ row: tr, col: c, color: 'rgba(50,100,255,0.5)', text: '+' + cell.heal });
      }
    }
  }
  return hl;
}

/* ================= УРОН ================= */
function applyDamageToUnit(row, col, dmg) {
  const tc = grid[row] && grid[row][col];
  if (!tc || !tc.unit) return false;
  tc.hp -= dmg;
  highlightedCells.push({ row, col, color: 'rgba(255,40,40,0.85)', text: '-' + dmg });
  if (tc.hp <= 0) { clearCell(row, col); return true; }
  return false;
}

/* Всплывающий попап урона по базе */
function spawnBaseDamagePopup(target, dmg, remaining) {
  baseDamagePopups.push({
    target: target,
    dmg: dmg,
    remaining: remaining,
    startTime: Date.now(),
    duration: 1500
  });
}

function dealBaseDamageLocal(target, dmg) {
  if (target === 'enemy') {
    enemyBaseHp = Math.max(0, enemyBaseHp - dmg);
    spawnBaseDamagePopup('enemy', dmg, enemyBaseHp);
    if (enemyBaseHp <= 0 && !gameOver) { gameOver = true; setTimeout(() => endGame('player'), 800); }
  } else {
    playerBaseHp = Math.max(0, playerBaseHp - dmg);
    spawnBaseDamagePopup('player', dmg, playerBaseHp);
    if (playerBaseHp <= 0 && !gameOver) { gameOver = true; setTimeout(() => endGame('enemy'), 800); }
  }
}

function sendDamageEvent(targetRow, targetCol, dmg) {
  if (!pvpRoom || !pvpOpponentId) return;
  const path = 'pvp_damage/' + pvpRoom + '/' + pvpOpponentId;
  const newRef = push(ref(db, path));
  set(newRef, { row: targetRow, col: targetCol, dmg: dmg, time: Date.now() });
}

/* ================= АТАКА ================= */
function unitAttack(row, col) {
  const cell = grid[row] && grid[row][col];
  if (!cell || !cell.unit) return;

  const target = findAttackTarget(row, col);
  if (target) {
    const targetCell = grid[target.row] && grid[target.row][target.col];
    const isEnemyTarget = !!(targetCell && targetCell.unit && targetCell.owner === 'enemy');
    applyDamageToUnit(target.row, target.col, cell.damage);
    if (currentMode === 'pvp' && cell.owner === 'player' && isEnemyTarget) {
      const enemyRow = 5 - target.row;
      const enemyCol = 3 - target.col;
      sendDamageEvent(enemyRow, enemyCol, cell.damage);
    }
  } else if (canAttackBase(row, col)) {
    const dmg = cell.damage * BASE_DAMAGE_MULT;
    if (cell.owner === 'player') {
      dealBaseDamageLocal('enemy', dmg);
      if (currentMode === 'pvp') dealBaseDamage(pvpOpponentId, dmg);
    } else {
      dealBaseDamageLocal('player', dmg);
    }
  }

  if (cell.heal > 0 && cell.owner) {
    const dir = dirForOwner(cell.owner);
    for (let r = 1; r <= cell.attackRange; r++) {
      const tr = row + dir * r;
      if (tr < 0 || tr >= ROWS) break;
      for (let c = Math.max(0, col - 1); c <= Math.min(COLS - 1, col + 1); c++) {
        const tc = grid[tr] && grid[tr][c];
        if (tc && tc.unit && tc.owner === cell.owner) {
          const oldHp = tc.hp;
          tc.hp = Math.min(tc.maxHp, tc.hp + cell.heal);
          const ah = tc.hp - oldHp;
          if (ah > 0) highlightedCells.push({ row: tr, col: c, color: 'rgba(50,255,100,0.6)', text: '+' + ah });
          break;
        }
      }
    }
  }

  if (currentMode === 'pvp') saveMyField();
}

/* ================= ИИ ================= */
function executeEnemyTurn() {
  if (gameOver) return;
  const units = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    if (grid[r] && grid[r][c] && grid[r][c].unit && grid[r][c].owner === 'enemy' && !grid[r][c].hasMovedThisRound)
      units.push({ row: r, col: c });
  if (!units.length) return;

  const attackers = units.filter(u => findAttackTarget(u.row, u.col) || canAttackBase(u.row, u.col));
  if (attackers.length) {
    const chosen = attackers[Math.floor(Math.random() * attackers.length)];
    grid[chosen.row][chosen.col].hasMovedThisRound = true;
    highlightedCells = calculateHighlights(chosen.row, chosen.col);
    setTimeout(() => {
      unitAttack(chosen.row, chosen.col);
      setTimeout(() => { highlightedCells = []; }, 1200);
    }, 200);
    return;
  }

  const movers = units.filter(u => getMoveTarget(u.row, u.col));
  if (movers.length) {
    const chosen = movers[Math.floor(Math.random() * movers.length)];
    grid[chosen.row][chosen.col].hasMovedThisRound = true;
    const dest = getMoveTarget(chosen.row, chosen.col);
    moveUnit(chosen.row, chosen.col);
    if (dest) highlightedCells = [{ row: dest.row, col: dest.col, color: 'rgba(255,220,60,0.55)', text: '👣' }];
    setTimeout(() => { highlightedCells = []; }, 1200);
    return;
  }

  const chosen = units[Math.floor(Math.random() * units.length)];
  grid[chosen.row][chosen.col].hasMovedThisRound = true;
}

/* ================= ФАЗЫ ================= */
function startPlacementPhase(fromRemote, keepShop) {
  if (gameOver) return;
  gamePhase = 'placement';
  isPlayerTurn = false;
  lastTurnFlag = false;

  const elixirBonus = selectedHero ? (selectedHero.bonusElixir || 0) : 0;
  elixir = Math.min(MAX_ELIXIR, elixir + 5 + elixirBonus);

  selectedUnitRow = -1; selectedUnitCol = -1;
  highlightedCells = []; placementHighlights = [];
  moveTargetCell = null; baseTargetHighlight = null;
  updateElixirDisplay(); updatePhaseDisplay();

  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    if (grid[r] && grid[r][c]) grid[r][c].hasMovedThisRound = false;

  if (!keepShop) {
    availableCards = shuffleArray(ALL_CARDS).slice(0, 5);
    purchasedCards = [];
    placementExtensions = 0;
  }
  selectedPurchasedCard = null;
  renderCards();

  timerSeconds = keepShop ? 10 : 20;
  document.getElementById('game-timer').textContent = timerSeconds;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerSeconds--;
    document.getElementById('game-timer').textContent = timerSeconds;
    if (timerSeconds <= 0) { clearInterval(timerInterval); timerInterval = null; startBattlePhase(); }
  }, 1000);

  if (currentMode === 'pvp') {
    saveMyField();
    if (!fromRemote) syncStateToFB();
  }
}

function startBattlePhase() {
  if (gameOver) return;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  const pUnits = countUnitsInRows(3, 6);
  const eUnits = countUnitsInRows(0, 3);

  if (pUnits === 0 && eUnits === 0) {
    placementExtensions++;
    if (placementExtensions >= 2) startPlacementPhase(false, false);
    else startPlacementPhase(false, true);
    return;
  }

  gamePhase = 'playerTurn';
  battlePhaseCount++;
  selectedUnitRow = -1; selectedUnitCol = -1;
  highlightedCells = []; placementHighlights = [];
  moveTargetCell = null; baseTargetHighlight = null;
  document.getElementById('game-timer').textContent = '';

  const pMoves = countMovableInRows(3, 6);
  const eMoves = countMovableInRows(0, 3);

  if (pUnits === 0 || eUnits === 0) {
    isPlayerTurn = (pUnits > 0);
    lastTurnFlag = true;
    updatePhaseDisplay();
    if (currentMode === 'pvp') syncStateToFB({ isLastTurn: true });
    if (!isPlayerTurn && currentMode !== 'pvp') {
      setTimeout(() => { executeEnemyTurn(); setTimeout(() => { if (!gameOver) { lastTurnFlag = false; startPlacementPhase(); } }, 900); }, 700);
    }
    return;
  }

  if (pMoves === 0 && eMoves === 0) { startPlacementPhase(); return; }

  if (pMoves === 0) isPlayerTurn = false;
  else if (eMoves === 0) isPlayerTurn = true;
  else if (currentMode === 'pvp') isPlayerTurn = pvpIsHost ? Math.random() < 0.5 : false;
  else isPlayerTurn = Math.random() < 0.5;

  lastTurnFlag = false;
  updatePhaseDisplay();
  if (currentMode === 'pvp') syncStateToFB();

  if (!isPlayerTurn && currentMode !== 'pvp') setTimeout(() => enemyTurnAndContinue(), 700);
}

function enemyTurnAndContinue() {
  if (gameOver) return;
  executeEnemyTurn();
  setTimeout(() => {
    if (gameOver) return;
    if (lastTurnFlag) { lastTurnFlag = false; startPlacementPhase(); }
    else processTurn();
  }, 900);
}

function processTurn() {
  if (gameOver) return;

  const pUnits = countUnitsInRows(3, 6);
  const eUnits = countUnitsInRows(0, 3);
  const pMoves = countMovableInRows(3, 6);
  const eMoves = countMovableInRows(0, 3);

  if (pUnits === 0 && eUnits === 0) { startPlacementPhase(); return; }
  if (pMoves === 0 && eMoves === 0) { startPlacementPhase(); return; }

  if (pUnits === 0 || pMoves === 0) {
    if (eMoves === 0) { startPlacementPhase(); return; }
    isPlayerTurn = false;
    lastTurnFlag = (eMoves === 1);
    updatePhaseDisplay();
    if (currentMode === 'pvp') { syncStateToFB({ isLastTurn: lastTurnFlag }); return; }
    setTimeout(() => enemyTurnAndContinue(), 600);
    return;
  }

  if (eUnits === 0 || eMoves === 0) {
    if (pMoves === 0) { startPlacementPhase(); return; }
    isPlayerTurn = true;
    lastTurnFlag = (pMoves === 1);
    updatePhaseDisplay();
    if (currentMode === 'pvp') syncStateToFB({ isLastTurn: lastTurnFlag });
    return;
  }

  isPlayerTurn = !isPlayerTurn;
  lastTurnFlag = false;
  updatePhaseDisplay();
  if (currentMode === 'pvp') syncStateToFB();

  if (!isPlayerTurn && currentMode !== 'pvp') setTimeout(() => enemyTurnAndContinue(), 700);
}

function endGame(winner) {
  if (!gameOver) gameOver = true;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  const modal = document.getElementById('game-over-modal');
  const titleEl = document.getElementById('game-over-title');
  const textEl = document.getElementById('game-over-text');

  if (winner === 'player') {
    titleEl.textContent = '🏆 ПОБЕДА!';
    titleEl.className = 'game-over-title win';
    textEl.textContent = 'Вы разрушили базу противника!';
  } else {
    titleEl.textContent = '💀 ПОРАЖЕНИЕ';
    titleEl.className = 'game-over-title lose';
    textEl.textContent = 'Ваша база пала...';
  }
  modal.classList.add('active');
}

/* ================= ДЕЙСТВИЯ ИГРОКА ================= */
function playerSelectUnit(row, col) {
  selectedUnitRow = row;
  selectedUnitCol = col;
  const cell = grid[row][col];
  highlightedCells = calculateHighlights(row, col);
  moveTargetCell = getMoveTarget(row, col);
  baseTargetHighlight = canAttackBase(row, col) ? (cell.owner === 'player' ? 'enemy' : 'player') : null;
}

function clearSelection() {
  selectedUnitRow = -1; selectedUnitCol = -1;
  highlightedCells = []; moveTargetCell = null; baseTargetHighlight = null;
}

function afterPlayerAction() {
  if (currentMode === 'pvp') saveMyField();
  if (lastTurnFlag) { lastTurnFlag = false; startPlacementPhase(); }
  else processTurn();
}

function playerDoMove() {
  const row = selectedUnitRow, col = selectedUnitCol;
  if (row < 0) return;
  const cell = grid[row][col];
  if (!cell || !cell.unit) return;
  const ok = moveUnit(row, col);
  clearSelection();
  if (!ok) { afterPlayerAction(); return; }
  afterPlayerAction();
}

function playerDoAttack() {
  const row = selectedUnitRow, col = selectedUnitCol;
  if (row < 0) return;
  const cell = grid[row][col];
  if (!cell || !cell.unit) return;
  cell.hasMovedThisRound = true;
  highlightedCells = calculateHighlights(row, col);
  moveTargetCell = null;
  if (attackAnimationTimeout) clearTimeout(attackAnimationTimeout);
  attackAnimationTimeout = setTimeout(() => {
    unitAttack(row, col);
    setTimeout(() => { clearSelection(); afterPlayerAction(); }, 600);
  }, 300);
}

/* ================= ОТРИСОВКА ================= */
function drawHeroBadge(cx, cy, radius, hero, isEnemy) {
  ctx.beginPath();
  ctx.arc(cx, cy, radius + 3, 0, Math.PI * 2);
  ctx.fillStyle = isEnemy ? 'rgba(255,70,70,0.18)' : 'rgba(77,150,255,0.18)';
  ctx.fill();

  const grad = ctx.createRadialGradient(cx - radius * 0.35, cy - radius * 0.35, radius * 0.1, cx, cy, radius);
  grad.addColorStop(0, isEnemy ? 'rgba(255,130,130,0.55)' : 'rgba(130,190,255,0.55)');
  grad.addColorStop(1, 'rgba(8,10,26,0.95)');
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  let drewImage = false;
  if (hero && hero.image) {
    const rec = loadImage(hero.image);
    if (rec && rec.loaded && !rec.failed) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, radius - 1.5, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(rec.img, cx - radius, cy - radius, radius * 2, radius * 2);
      ctx.restore();
      drewImage = true;
    }
  }
  if (!drewImage) {
    ctx.font = Math.round(radius * 1.15) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(hero ? hero.emoji : '👤', cx, cy + radius * 0.06);
  }

  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = isEnemy ? '#ff5555' : '#4d96ff';
  ctx.stroke();
}

function drawBaseHp(rightX, y, hp, maxHp, size) {
  ctx.font = 'bold ' + size + 'px Arial';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  const pct = maxHp > 0 ? hp / maxHp : 0;
  ctx.fillStyle = pct > 0.5 ? '#7dff9b' : (pct > 0.25 ? '#ffd93d' : '#ff6b6b');
  ctx.fillText(Math.max(0, Math.round(hp)) + ' ❤️', rightX, y);
}

function drawBases() {
  const radius = Math.max(13, Math.min(18, BASE_AREA_H * 0.37));
  const avatarCx = canvas.width - 10 - radius;
  const hpRightX = avatarCx - radius - 8;
  const hpSize = Math.min(16, BASE_AREA_H * 0.38);

  const eY = BASE_AREA_H / 2;
  const pY = canvas.height - BASE_AREA_H / 2;

  drawBaseHp(hpRightX, eY, enemyBaseHp, enemyMaxBaseHp, hpSize);
  drawHeroBadge(avatarCx, eY, radius, enemyHero, true);

  drawBaseHp(hpRightX, pY, playerBaseHp, playerMaxBaseHp, hpSize);
  drawHeroBadge(avatarCx, pY, radius, selectedHero, false);

  if (baseTargetHighlight) {
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 180);
    const ty = baseTargetHighlight === 'enemy' ? eY : pY;
    ctx.beginPath();
    ctx.arc(avatarCx, ty, radius + 5, 0, Math.PI * 2);
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255,60,60,' + (0.35 + 0.55 * pulse) + ')';
    ctx.stroke();
  }

  /* ===== Всплывающие попапы урона по базам ===== */
  const now = Date.now();
  baseDamagePopups = baseDamagePopups.filter(p => now - p.startTime < p.duration);
  baseDamagePopups.forEach(p => {
    const elapsed = now - p.startTime;
    const progress = elapsed / p.duration;
    const alpha = Math.max(0, 1 - Math.pow(progress, 1.5));
    const y = p.target === 'enemy' ? eY : pY;
    const floatDir = p.target === 'enemy' ? -1 : 1;
    const yOffset = floatDir * progress * radius * 1.6;

    const px = avatarCx - radius - 28;

    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const dmgText = '-' + p.dmg;
    ctx.font = 'bold ' + Math.round(radius * 1.15) + 'px Arial';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
    ctx.strokeText(dmgText, px, y + yOffset);
    ctx.fillStyle = '#ff3b3b';
    ctx.fillText(dmgText, px, y + yOffset);

    const remainText = p.remaining + '/' + (p.target === 'enemy' ? enemyMaxBaseHp : playerMaxBaseHp) + ' ❤️';
    ctx.font = 'bold ' + Math.round(radius * 0.72) + 'px Arial';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
    ctx.strokeText(remainText, px, y + yOffset + floatDir * radius * 0.95);
    ctx.fillStyle = '#ffe9e9';
    ctx.fillText(remainText, px, y + yOffset + floatDir * radius * 0.95);

    ctx.globalAlpha = 1;
  });
}

function drawUnitInCell(cell, x, y, row) {
  /* Красная подложка ТОЛЬКО для врага на МОЁМ поле (строки 3..5) —
     уменьшенная копия клетки, перекрашенная в красный, по центру. */
  if (cell.owner === 'enemy' && row >= 3) {
    const pulse = 0.55 + 0.35 * Math.sin(Date.now() / 260);
    const innerSize = cellSize / 1.5;
    const ix = x + (cellSize - innerSize) / 2;
    const iy = y + (cellSize - innerSize) / 2;
    const irc = innerSize * 0.15;

    /* мягкое свечение вокруг */
    ctx.save();
    ctx.shadowColor = 'rgba(255,50,50,' + (0.75 + 0.25 * pulse) + ')';
    ctx.shadowBlur = 12;
    ctx.fillStyle = 'rgba(210,25,25,' + (0.55 + 0.25 * pulse) + ')';
    ctx.beginPath();
    ctx.roundRect(ix, iy, innerSize, innerSize, irc);
    ctx.fill();
    ctx.restore();

    /* обводка */
    ctx.beginPath();
    ctx.roundRect(ix, iy, innerSize, innerSize, irc);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,90,90,' + (0.75 + 0.25 * pulse) + ')';
    ctx.stroke();
  }

  let drew = false;
  if (cell.cardData && cell.cardData.image) {
    const rec = loadImage(cell.cardData.image);
    if (rec && rec.loaded && !rec.failed) {
      const imgSize = cellSize * 0.72;
      const imgX = x + (cellSize - imgSize) / 2;
      const imgY = y + cellSize * 0.06;
      ctx.drawImage(rec.img, imgX, imgY, imgSize, imgSize);
      drew = true;
    }
  }
  if (!drew) {
    ctx.fillStyle = '#fff';
    ctx.font = (cellSize * 0.35) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cell.unit, x + cellSize / 2, y + cellSize / 2 - cellSize * 0.1);
  }
}

function drawGrid() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawBases();

  const cr = cellSize * 0.1, gapBetween = 10;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!grid[r] || !grid[r][c]) continue;
      const x = gridOffsetX + c * (cellSize + gapBetween);
      const y = gridOffsetY + r * (cellSize + gapBetween);
      const cell = grid[r][c];

      ctx.fillStyle = cell.color;
      ctx.beginPath();
      ctx.roundRect(x, y, cellSize, cellSize, cr);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x + 1, y + 1, cellSize - 2, cellSize - 2, cr);
      ctx.stroke();

      if (r === selectedUnitRow && c === selectedUnitCol) {
        ctx.fillStyle = 'rgba(255,215,0,0.3)';
        ctx.beginPath();
        ctx.roundRect(x + 1, y + 1, cellSize - 2, cellSize - 2, cr);
        ctx.fill();
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      if (cell.unit && cell.owner === 'player' && !cell.hasMovedThisRound &&
          gamePhase === 'playerTurn' && isPlayerTurn) {
        ctx.fillStyle = lastTurnFlag ? 'rgba(255,100,255,0.35)' : 'rgba(255,255,100,0.3)';
        ctx.beginPath();
        ctx.roundRect(x + 1, y + 1, cellSize - 2, cellSize - 2, cr);
        ctx.fill();
      }

      if (cell.unit) {
        drawUnitInCell(cell, x, y, r);
        const bw = cellSize * 0.75, bh = 4;
        const bx = x + (cellSize - bw) / 2, by = y + cellSize - 7;
        ctx.fillStyle = '#333';
        ctx.fillRect(bx, by, bw, bh);
        const pct = cell.hp / cell.maxHp;
        ctx.fillStyle = pct > 0.5 ? '#4caf50' : pct > 0.25 ? '#ff9800' : '#f44336';
        ctx.fillRect(bx, by, bw * pct, bh);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold ' + Math.max(6, cellSize * 0.16) + 'px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(Math.ceil(cell.hp) + '/' + cell.maxHp, x + cellSize / 2, y + cellSize - 10);
      }
    }
  }

  placementHighlights.forEach(h => {
    const x = gridOffsetX + h.col * (cellSize + gapBetween);
    const y = gridOffsetY + h.row * (cellSize + gapBetween);
    ctx.fillStyle = h.color;
    ctx.beginPath();
    ctx.roundRect(x + 2, y + 2, cellSize - 4, cellSize - 4, cr);
    ctx.fill();
    ctx.strokeStyle = 'rgba(50,255,50,0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  highlightedCells.forEach(h => {
    const x = gridOffsetX + h.col * (cellSize + gapBetween);
    const y = gridOffsetY + h.row * (cellSize + gapBetween);
    ctx.fillStyle = h.color;
    ctx.beginPath();
    ctx.roundRect(x + 2, y + 2, cellSize - 4, cellSize - 4, cr);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
    if (h.text) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + Math.max(12, cellSize * 0.35) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeText(h.text, x + cellSize / 2, y + cellSize / 2);
      ctx.fillText(h.text, x + cellSize / 2, y + cellSize / 2);
    }
  });

  if (moveTargetCell && selectedUnitRow >= 0) {
    const x = gridOffsetX + moveTargetCell.col * (cellSize + gapBetween);
    const y = gridOffsetY + moveTargetCell.row * (cellSize + gapBetween);
    const pulse = 0.45 + 0.35 * Math.sin(Date.now() / 220);
    ctx.fillStyle = 'rgba(60,255,140,' + pulse + ')';
    ctx.beginPath();
    ctx.roundRect(x + 2, y + 2, cellSize - 4, cellSize - 4, cr);
    ctx.fill();
    ctx.strokeStyle = '#3cff8c';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(x + 2, y + 2, cellSize - 4, cellSize - 4, cr);
    ctx.stroke();

    ctx.fillStyle = '#04361c';
    ctx.font = 'bold ' + Math.max(14, cellSize * 0.5) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('👣', x + cellSize / 2, y + cellSize / 2);
  }
}

/* ================= PVP СИНХРОНИЗАЦИЯ ================= */
function saveMyField() {
  if (!pvpRoom) return;
  const myUnits = {};
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = grid[r] && grid[r][c];
      if (cell && cell.unit && cell.owner === 'player') {
        myUnits['r' + r + 'c' + c] = {
          u: cell.unit,
          h: cell.hp,
          mh: cell.maxHp,
          d: cell.damage,
          ar: cell.attackRange,
          heal: cell.heal || 0,
          hm: cell.hasMovedThisRound ? 1 : 0,
          img: (cell.cardData && cell.cardData.image) ? cell.cardData.image : 0
        };
      }
    }
  }
  set(ref(db, 'pvp_fields/' + pvpRoom + '/' + playerId), {
    u: myUnits,
    t: Date.now()
  });
}

function applyOpponentField(data) {
  const u = (data && data.u) ? data.u : {};
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const myRow = 5 - r;
      const myCol = 3 - c;
      if (!grid[myRow]) grid[myRow] = [];
      if (!grid[myRow][myCol]) grid[myRow][myCol] = makeEmptyCell(myRow < 3);
      const cell = grid[myRow][myCol];
      const ud = u['r' + r + 'c' + c];
      if (ud && ud.u) {
        if (cell.unit && cell.owner === 'player') continue;
        cell.unit = ud.u;
        cell.owner = 'enemy';
        cell.hp = ud.h;
        cell.maxHp = ud.mh;
        cell.damage = ud.d;
        cell.attackRange = ud.ar;
        cell.heal = ud.heal || 0;
        cell.hasMovedThisRound = !!ud.hm;
        cell.cardData = { image: ud.img || null, emoji: ud.u, name: 'Враг' };
      } else if (cell.unit && cell.owner === 'enemy') {
        clearCell(myRow, myCol);
      }
    }
  }
}

function watchOpponentField() {
  if (!pvpRoom || !pvpOpponentId) return;
  if (opponentFieldUnsub) opponentFieldUnsub();
  opponentFieldUnsub = onValue(ref(db, 'pvp_fields/' + pvpRoom + '/' + pvpOpponentId), (snap) => {
    applyOpponentField(snap.val());
  });
}

function watchDamageQueue() {
  if (!pvpRoom) return;
  if (damageQueueUnsub) damageQueueUnsub();
  const path = 'pvp_damage/' + pvpRoom + '/' + playerId;
  damageQueueUnsub = onChildAdded(ref(db, path), (snap) => {
    const d = snap.val();
    if (d) {
      const cell = grid[d.row] && grid[d.row][d.col];
      if (cell && cell.unit) {
        cell.hp -= d.dmg;
        highlightedCells.push({ row: d.row, col: d.col, color: 'rgba(255,40,40,0.85)', text: '-' + d.dmg });
        setTimeout(() => { highlightedCells = highlightedCells.filter(h => !(h.row === d.row && h.col === d.col)); }, 900);
        if (cell.hp <= 0) clearCell(d.row, d.col);
        saveMyField();
      }
    }
    remove(snap.ref);
  });
}

function syncStateToFB(extra) {
  if (!pvpRoom) return;
  const payload = {
    phase: gamePhase,
    isPlayerTurn,
    currentPlayer: isPlayerTurn ? playerId : pvpOpponentId,
    battlePhase: battlePhaseCount
  };
  if (extra) Object.assign(payload, extra);
  set(ref(db, 'rooms/' + pvpRoom + '/state'), payload);
}

function syncHero() {
  if (!pvpRoom) return;
  set(ref(db, 'rooms/' + pvpRoom + '/heroes/' + playerId), selectedHero ? selectedHero.id : DEFAULT_HERO.id);
}

function watchHeroes() {
  if (!pvpRoom || !pvpOpponentId) return;
  if (heroUnsub) heroUnsub();
  heroUnsub = onValue(ref(db, 'rooms/' + pvpRoom + '/heroes/' + pvpOpponentId), (snap) => {
    const id = snap.val();
    if (!id) return;
    const h = heroById(id);
    if (h) {
      enemyHero = h;
      enemyMaxBaseHp = computeMaxBaseHp(h);
    }
  });
}

function watchGameState() {
  if (!pvpRoom) return;
  if (gameStateUnsub) gameStateUnsub();
  gameStateUnsub = onValue(ref(db, 'rooms/' + pvpRoom + '/state'), (snap) => {
    const s = snap.val();
    if (!s) return;
    if (typeof s.battlePhase === 'number' && s.battlePhase > battlePhaseCount) battlePhaseCount = s.battlePhase;
    if (s.phase === 'placement' && gamePhase !== 'placement') { startPlacementPhase(true); return; }
    if (s.currentPlayer === playerId) {
      gamePhase = s.phase;
      isPlayerTurn = true;
      lastTurnFlag = !!s.isLastTurn;
    } else {
      gamePhase = s.phase;
      isPlayerTurn = false;
      lastTurnFlag = false;
    }
    updatePhaseDisplay();
  });
}

function dealBaseDamage(targetPlayerId, amount) {
  if (!pvpRoom || !targetPlayerId) return;
  const dmg = amount || 1;
  const path = 'pvp_base_hp/' + pvpRoom + '/' + targetPlayerId;
  get(ref(db, path)).then(snap => {
    const cur = snap.val();
    const curVal = (cur === null || cur === undefined) ? MAX_BASE_HP : cur;
    set(ref(db, path), Math.max(0, curVal - dmg));
  });
}

function watchBaseHp() {
  if (!pvpRoom) return;
  if (pvpHpUnsub1) pvpHpUnsub1();
  if (pvpHpUnsub2) pvpHpUnsub2();

  pvpHpUnsub1 = onValue(ref(db, 'pvp_base_hp/' + pvpRoom + '/' + playerId), (snap) => {
    const v = snap.val();
    if (v !== null && v !== undefined) {
      const prev = playerBaseHp;
      playerBaseHp = v;
      if (prev > v && prev > 0 && !gameOver) {
        spawnBaseDamagePopup('player', prev - v, v);
      }
      if (playerBaseHp <= 0 && !gameOver) { gameOver = true; setTimeout(() => endGame('enemy'), 600); }
    }
  });

  pvpHpUnsub2 = onValue(ref(db, 'pvp_base_hp/' + pvpRoom + '/' + pvpOpponentId), (snap) => {
    const v = snap.val();
    if (v !== null && v !== undefined) {
      const prev = enemyBaseHp;
      enemyBaseHp = v;
      if (prev > v && prev > 0 && !gameOver) {
        spawnBaseDamagePopup('enemy', prev - v, v);
      }
      if (enemyBaseHp <= 0 && !gameOver) { gameOver = true; setTimeout(() => endGame('player'), 600); }
    }
  });
}

/* ================= PVP ПОИСК ================= */
function startPvP() {
  document.getElementById('pvp-waiting').classList.add('active');
  let resolved = false;

  const unsubSignal = onValue(ref(db, 'pvp_signals/' + playerId), (snap) => {
    if (resolved || pvpRoom) return;
    const sig = snap.val();
    if (sig && sig.roomId) {
      resolved = true;
      pvpRoom = sig.roomId;
      pvpOpponentId = sig.hostId;
      pvpIsHost = false;
      remove(ref(db, 'pvp_signals/' + playerId));
      remove(ref(db, 'pvp_queue/' + playerId));
      unsubSignal();
      initGrid(true);
      document.getElementById('pvp-waiting').classList.remove('active');
      startGame();
      setTimeout(() => {
        watchOpponentField(); watchGameState(); watchDamageQueue(); watchBaseHp(); watchHeroes();
      }, 400);
    }
  });

  set(ref(db, 'pvp_queue/' + playerId), { playerId, time: Date.now() });

  setTimeout(() => {
    if (resolved || pvpRoom) return;
    const unsubQueue = onValue(ref(db, 'pvp_queue'), (snap) => {
      if (resolved || pvpRoom) return;
      const data = snap.val();
      if (!data) return;
      const others = Object.entries(data).filter(([key]) => key !== playerId);
      if (others.length > 0) {
        resolved = true;
        const [oppKey] = others[0];
        pvpRoom = 'room_' + Date.now();
        pvpOpponentId = oppKey;
        pvpIsHost = true;
        remove(ref(db, 'pvp_queue/' + playerId));
        remove(ref(db, 'pvp_queue/' + oppKey));
        unsubQueue();
        initGrid(true);
        set(ref(db, 'pvp_signals/' + oppKey), { roomId: pvpRoom, hostId: playerId });
        document.getElementById('pvp-waiting').classList.remove('active');
        startGame();
        setTimeout(() => {
          watchOpponentField(); watchGameState(); watchDamageQueue(); watchBaseHp(); watchHeroes();
        }, 400);
      }
    });
  }, 2000);

  setTimeout(() => {
    if (!resolved && document.getElementById('pvp-waiting').classList.contains('active')) {
      remove(ref(db, 'pvp_queue/' + playerId));
      remove(ref(db, 'pvp_signals/' + playerId));
      document.getElementById('pvp-waiting').classList.remove('active');
      alert('Соперник не найден');
    }
  }, 30000);
}

/* ================= СТАРТ ИГРЫ ================= */
function startGame() {
  lobby.style.display = 'none';
  lobby.classList.remove('active');
  gameScreen.classList.add('active');

  playerMaxBaseHp = computeMaxBaseHp(selectedHero);
  enemyMaxBaseHp = computeMaxBaseHp(enemyHero);

  playerBaseHp = playerMaxBaseHp;
  enemyBaseHp = enemyMaxBaseHp;
  gameOver = false;
  baseDamagePopups = [];
  battlePhaseCount = 0;
  placementExtensions = 0;
  document.getElementById('game-over-modal').classList.remove('active');

  elixir = 5;
  selectedUnitRow = -1; selectedUnitCol = -1;
  highlightedCells = []; placementHighlights = [];
  moveTargetCell = null; baseTargetHighlight = null;
  lastTurnFlag = false;

  if (currentMode === 'pvp' && pvpRoom) {
    set(ref(db, 'pvp_base_hp/' + pvpRoom + '/' + playerId), playerMaxBaseHp);
    syncHero();
  }

  startPlacementPhase();
  setTimeout(resizeCanvas, 300);
  if (gameLoopId) cancelAnimationFrame(gameLoopId);
  gameLoop();
}

function gameLoop() {
  drawGrid();
  gameLoopId = requestAnimationFrame(gameLoop);
}

function showLobby() {
  lobby.classList.add('active');
  lobby.style.display = 'flex';
}

/* ================= ОБРАБОТЧИКИ ================= */
document.getElementById('play-button').onclick = () => {
  if (currentMode === 'classic') {
    enemyHero = ALL_HEROES[Math.floor(Math.random() * ALL_HEROES.length)];
    initGrid(false);
    startGame();
  } else if (currentMode === 'pvp') {
    startPvP();
  }
};

document.getElementById('mode-button').onclick = () => openModePage();
document.getElementById('mode-page-back').onclick = () => closeModePage();

document.getElementById('pvp-cancel').onclick = () => {
  remove(ref(db, 'pvp_queue/' + playerId));
  remove(ref(db, 'pvp_signals/' + playerId));
  document.getElementById('pvp-waiting').classList.remove('active');
};

function cleanupGame() {
  if (timerInterval) clearInterval(timerInterval);
  if (gameLoopId) cancelAnimationFrame(gameLoopId);
  if (attackAnimationTimeout) clearTimeout(attackAnimationTimeout);
  if (pvpHpUnsub1) { pvpHpUnsub1(); pvpHpUnsub1 = null; }
  if (pvpHpUnsub2) { pvpHpUnsub2(); pvpHpUnsub2 = null; }
  if (damageQueueUnsub) { damageQueueUnsub(); damageQueueUnsub = null; }
  if (opponentFieldUnsub) { opponentFieldUnsub(); opponentFieldUnsub = null; }
  if (gameStateUnsub) { gameStateUnsub(); gameStateUnsub = null; }
  if (heroUnsub) { heroUnsub(); heroUnsub = null; }
  if (pvpRoom) {
    remove(ref(db, 'pvp_fields/' + pvpRoom));
    remove(ref(db, 'rooms/' + pvpRoom));
    remove(ref(db, 'pvp_base_hp/' + pvpRoom));
    remove(ref(db, 'pvp_damage/' + pvpRoom));
    pvpRoom = null; pvpOpponentId = null;
  }
  gameOver = false;
  baseDamagePopups = [];
  battlePhaseCount = 0;
  placementExtensions = 0;
  clearSelection();
  placementHighlights = [];
  document.getElementById('game-over-modal').classList.remove('active');
}

document.getElementById('back-button').onclick = () => {
  cleanupGame();
  gameScreen.classList.remove('active');
  showLobby();
};

document.getElementById('game-over-btn').onclick = () => {
  document.getElementById('game-over-modal').classList.remove('active');
  cleanupGame();
  gameScreen.classList.remove('active');
  showLobby();
};

document.getElementById('nav-home').onclick = () => {
  document.getElementById('home-page').style.display = 'flex';
  document.getElementById('cards-page').classList.remove('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-home').classList.add('active');
};

document.getElementById('nav-cards').onclick = () => {
  document.getElementById('home-page').style.display = 'none';
  document.getElementById('cards-page').classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-cards').classList.add('active');
  renderAllCardsPage();
  renderHeroesPage();
};

document.getElementById('tab-all-cards').onclick = () => {
  document.getElementById('tab-all-cards').classList.add('active');
  document.getElementById('tab-heroes').classList.remove('active');
  document.getElementById('all-cards-section').style.display = 'block';
  document.getElementById('heroes-section').style.display = 'none';
  renderAllCardsPage();
};
document.getElementById('tab-heroes').onclick = () => {
  document.getElementById('tab-heroes').classList.add('active');
  document.getElementById('tab-all-cards').classList.remove('active');
  document.getElementById('all-cards-section').style.display = 'none';
  document.getElementById('heroes-section').style.display = 'block';
  renderHeroesPage();
};

/* ================= КЛИК ПО ПОЛЮ ================= */
canvas.onclick = e => {
  if (gameOver) return;
  if (!gameScreen.classList.contains('active')) return;

  const rect = canvas.getBoundingClientRect();
  if (rect.width === 0) return;

  const mx = e.clientX - rect.left, my = e.clientY - rect.top, gapBetween = 10;
  const col = Math.floor((mx - gridOffsetX) / (cellSize + gapBetween));
  const row = Math.floor((my - gridOffsetY) / (cellSize + gapBetween));

  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) {
    if (gamePhase === 'playerTurn' && isPlayerTurn) clearSelection();
    return;
  }

  if (gamePhase === 'placement') {
    if (row >= 3 && selectedPurchasedCard && !grid[row][col].unit) {
      const card = selectedPurchasedCard.card;
      const hpBonus = selectedHero ? (selectedHero.bonusHp || 0) : 0;
      const dmgBonus = selectedHero ? (selectedHero.bonusDmg || 0) : 0;
      grid[row][col].unit = card.emoji;
      grid[row][col].owner = 'player';
      grid[row][col].hp = card.hp + hpBonus;
      grid[row][col].maxHp = card.maxHp + hpBonus;
      grid[row][col].damage = card.damage + dmgBonus;
      grid[row][col].attackRange = card.attackRange;
      grid[row][col].heal = card.heal || 0;
      grid[row][col].cardData = card;
      purchasedCards.splice(selectedPurchasedCard.index, 1);
      selectedPurchasedCard = null;
      placementHighlights = [];
      renderCards();
      if (currentMode === 'pvp') saveMyField();
    }
    return;
  }

  if (gamePhase !== 'playerTurn' || !isPlayerTurn) return;

  const cell = grid[row][col];

  if (moveTargetCell && selectedUnitRow >= 0 &&
      row === moveTargetCell.row && col === moveTargetCell.col) {
    playerDoMove();
    return;
  }

  if (cell && cell.unit && cell.owner === 'enemy' && selectedUnitRow >= 0) {
    const selCell = grid[selectedUnitRow] && grid[selectedUnitRow][selectedUnitCol];
    if (selCell && selCell.unit && selCell.owner === 'player' && !selCell.hasMovedThisRound) {
      const atkTarget = findAttackTarget(selectedUnitRow, selectedUnitCol);
      if (atkTarget && atkTarget.row === row && atkTarget.col === col) {
        playerDoAttack();
        return;
      }
    }
  }

  if (cell && cell.unit && cell.owner === 'player' && !cell.hasMovedThisRound) {
    if (selectedUnitRow === row && selectedUnitCol === col) {
      playerDoAttack();
    } else {
      playerSelectUnit(row, col);
    }
    return;
  }

  clearSelection();
};

document.getElementById('menu-toggle').onclick = () => {
  const m = document.getElementById('settings-menu');
  const o = document.getElementById('settings-overlay');
  const t = document.getElementById('menu-toggle');
  m.classList.toggle('active');
  o.classList.toggle('active');
  t.classList.toggle('active');
};
document.getElementById('settings-overlay').onclick = () => {
  document.getElementById('settings-menu').classList.remove('active');
  document.getElementById('settings-overlay').classList.remove('active');
  document.getElementById('menu-toggle').classList.remove('active');
};

/* ================= РЕСАЙЗ ================= */
function resizeCanvas() {
  const cont = document.getElementById('game-container');
  const ca = document.getElementById('cards-area');
  if (!cont || !ca) return;
  const rect = cont.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) { requestAnimationFrame(resizeCanvas); return; }
  const ch = ca.offsetHeight || 120, ah = rect.height - 38 - ch;
  canvas.width = rect.width;
  canvas.height = Math.max(200, ah);
  const gridTop = BASE_AREA_H + 6;
  const gridBottom = canvas.height - BASE_AREA_H - 6;
  const gridAreaH = Math.max(100, gridBottom - gridTop);
  const gapBetween = 10, gapEdge = 10;
  const maxW = (canvas.width - gapBetween * (COLS - 1) - gapEdge * 2) / COLS;
  const maxH = (gridAreaH - gapBetween * (ROWS - 1) - gapEdge * 2) / ROWS;
  cellSize = Math.floor(Math.max(14, Math.min(maxW, maxH)));
  gridOffsetX = Math.floor((canvas.width - cellSize * COLS - gapBetween * (COLS - 1)) / 2);
  gridOffsetY = Math.floor(gridTop + (gridAreaH - cellSize * ROWS - gapBetween * (ROWS - 1)) / 2);
}

window.addEventListener('resize', () => {
  if (gameScreen.classList.contains('active')) resizeCanvas();
});
window.addEventListener('orientationchange', () => {
  if (gameScreen.classList.contains('active')) setTimeout(resizeCanvas, 500);
});

/* ================= ИНИЦИАЛИЗАЦИЯ ================= */
preloadAllImages();
updateModeLabel();

let progress = 0;
const loadInterval = setInterval(() => {
  progress += Math.random() * 15;
  if (progress >= 100) {
    progress = 100;
    clearInterval(loadInterval);
    setTimeout(() => {
      preloader.classList.add('hidden');
      setTimeout(() => { preloader.style.display = 'none'; showLobby(); }, 800);
    }, 500);
  }
  loadingBar.style.width = Math.floor(progress) + '%';
  loadingPercentage.textContent = Math.floor(progress) + '%';
}, 300);
</script>
