    .play-btn { width: 190px; height: 58px; background: linear-gradient(135deg,#4d96ff,#6bcb77); border: none; border-radius: 32px; color: white; font-size: 22px; font-weight: bold; cursor: pointer; letter-spacing: 3px; box-shadow: 0 6px 22px rgba(77,150,255,0.4); text-transform: uppercase; position: relative; overflow: hidden; }
    .play-btn::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg,transparent,rgba(255,255,255,0.2),transparent); transform: rotate(45deg); animation: btnShine 3s infinite; } @keyframes btnShine { 0%{transform:translateX(-100%) rotate(45deg)}100%{transform:translateX(100%) rotate(45deg)} }

const imageCache = new Map();
function loadImage(src) {
  if (!src) return null;
  if (imageCache.has(src)) return imageCache.get(src);
  const img = new Image();
  img.crossOrigin = 'anonymous';
  const rec = { img, loaded: false, failed: false };
  img.onload = () => { rec.loaded = true; };
  img.onerror = () => { rec.failed = true; console.warn('Не удалось загрузить:', src); };
  img.src = src;
  imageCache.set(src, rec);
  return rec;
}
function preloadAllImages() {
  ALL_CARDS.forEach(c => c.image && loadImage(c.image));
  ALL_HEROES.forEach(h => h.image && loadImage(h.image));
  MODES.forEach(m => m.image && loadImage(m.image));
}

function heroById(id) { return ALL_HEROES.find(h => h.id === id) || null; }
function computeMaxBaseHp(hero) { return MAX_BASE_HP + (hero && hero.bonusBaseHp ? hero.bonusBaseHp : 0); }

/* ================= СЕТКА ================= */
function initGrid(isPvP) {
  grid.length = 0;
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      grid[r][c] = {
        color: r < 3 ? '#ff4444' : '#4488ff',
        unit: null, hp: 0, maxHp: 0, damage: 0,
        attackRange: 0, heal: 0, hasMovedThisRound: false, cardData: null
      };
    }
  }
  if (!isPvP) {
    const hpB = enemyHero ? (enemyHero.bonusHp || 0) : 0;
    const dmgB = enemyHero ? (enemyHero.bonusDmg || 0) : 0;
    for (let r = 0; r < 3; r++) for (let c = 0; c < COLS; c++) {
      grid[r][c].unit = '👾';
      grid[r][c].hp = 8 + hpB;
      grid[r][c].maxHp = 8 + hpB;
      grid[r][c].damage = 2 + dmgB;
      grid[r][c].attackRange = 1;
      grid[r][c].heal = 0;
      grid[r][c].cardData = { id: 'minion', name: 'Миньон', emoji: '👾', image: null, hp: 8 + hpB, maxHp: 8 + hpB, damage: 2 + dmgB, attackRange: 1 };
    }
  }
}

function shuffleArray(a) {
  const s = [...a];
  for (let i = s.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [s[i], s[j]] = [s[j], s[i]];
  }
  return s;
}

/* ================= КАРТЫ В БОЮ ================= */
function renderCards() {
  const aR = document.getElementById('available-cards');
  const pR = document.getElementById('purchased-cards');
  if (!aR || !pR) return;

  aR.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('div');
    s.className = 'card-slot';
    if (availableCards[i]) {
      const c = availableCards[i];
      const inner = c.image
        ? '<img class="slot-img" src="' + c.image + '" onerror="this.style.display=\'none\';this.parentNode.insertAdjacentHTML(\'afterbegin\',\'<span class=&quot;slot-emoji&quot;>' + c.emoji + '</span>\');">'
        : '<span class="slot-emoji">' + c.emoji + '</span>';
      s.innerHTML = inner + '<span class="card-name">' + c.name + '</span><span class="card-cost">' + c.cost + '</span>';
      const b = document.createElement('button');
      b.className = 'buy-btn';
      b.textContent = 'КУПИТЬ';
      b.onclick = e => { e.stopPropagation(); buyCard(i); };
      s.appendChild(b);
    } else s.classList.add('empty');
    aR.appendChild(s);
  }

  pR.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('div');
    s.className = 'card-slot';
    if (i < purchasedCards.length) {
      const c = purchasedCards[i];
      s.classList.add('purchased');
      const inner = c.image
        ? '<img class="slot-img" src="' + c.image + '" onerror="this.style.display=\'none\';this.parentNode.insertAdjacentHTML(\'afterbegin\',\'<span class=&quot;slot-emoji&quot;>' + c.emoji + '</span>\');">'
        : '<span class="slot-emoji">' + c.emoji + '</span>';
      s.innerHTML = inner + '<span class="card-name">' + c.name + '</span>';
      s.onclick = () => {
        if (gamePhase === 'placement') {
          selectedPurchasedCard = { index: i, card: c };
          placementHighlights = [];
          for (let r = 3; r < 6; r++) for (let cl = 0; cl < COLS; cl++)
            if (!grid[r][cl].unit)
              placementHighlights.push({ row: r, col: cl, color: 'rgba(50,255,50,0.4)', text: '' });
        }
      };
    } else s.classList.add('empty');
    pR.appendChild(s);
  }
}

function buyCard(i) {
  if (gamePhase !== 'placement' || !availableCards[i]) return;
  const c = availableCards[i];
  if (elixir < c.cost) return;
  elixir -= c.cost;
  purchasedCards.push({ ...c });
  availableCards[i] = null;
  updateElixirDisplay();
  renderCards();
  if (currentMode === 'pvp') saveMyField();
}

function updateElixirDisplay() {
  const e = document.getElementById('elixir-display');
  if (e) e.textContent = '💜 ' + elixir;
}

function updatePhaseDisplay() {
  const e = document.getElementById('game-phase');
  if (!e) return;
  if (gamePhase === 'placement') e.textContent = 'РАССТАНОВКА';
  else if (gamePhase === 'playerTurn') {
    if (isPlayerTurn) e.textContent = lastTurnFlag ? 'ПОСЛЕДНИЙ ХОД' : 'ВАШ ХОД';
    else e.textContent = 'ХОД ПРОТИВНИКА';
  } else e.textContent = gamePhase;
}

/* ====== ПРОВЕРКА ПУСТОГО ПОЛЯ ====== */
function isFieldEmpty(startRow, endRow) {
  for (let r = startRow; r < endRow; r++) {
    if (!grid[r]) continue;
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c] && grid[r][c].unit) return false;
    }
  }
  return true;
}

/* ====== АТАКА ИГРОКОВ ====== */
function checkBaseAttacks() {
  if (gameOver) return false;
  if (gamePhase !== 'playerTurn') return false;
  if (battlePhaseCount <= 1) return false;

  let attacked = false;

  if (isFieldEmpty(0, 3) && enemyBaseHp > 0) {
    enemyBaseHp--;
    baseAttackAnim = { target: 'enemy', startTime: Date.now() };
    attacked = true;
    if (enemyBaseHp <= 0) {
      gameOver = true;
      setTimeout(() => endGame('player'), 900);
      return true;
    }
  }

  if (isFieldEmpty(3, 6) && playerBaseHp > 0) {
    playerBaseHp--;
    baseAttackAnim = { target: 'player', startTime: Date.now() };
    attacked = true;
    if (playerBaseHp <= 0) {
      gameOver = true;
      setTimeout(() => endGame('enemy'), 900);
      return true;
    }
  }

  return attacked;
}

function endGame(winner) {
  if (!gameOver) gameOver = true;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  const modal = document.getElementById('game-over-modal');
  const titleEl = document.getElementById('game-over-title');
  const textEl = document.getElementById('game-over-text');

  if (winner === 'player') {
    titleEl.textContent = '🏆 ПОБЕДА!';
    titleEl.className = 'game-over-title win';
    textEl.textContent = 'Вы повергли героя противника!';
  } else {
    titleEl.textContent = '💀 ПОРАЖЕНИЕ';
    titleEl.className = 'game-over-title lose';
    textEl.textContent = 'Ваш герой пал в бою...';
  }

  modal.classList.add('active');
}

/* ====== ПОДСВЕТКА ====== */
function calculateHighlights(row, col) {
  const hl = [], cell = grid[row][col];
  if (!cell || !cell.unit) return hl;
  const dir = -1;
  for (let r = 1; r <= cell.attackRange; r++) {
    const tr = row + dir * r;
    if (tr < 0 || tr >= ROWS) break;
    for (let c = Math.max(0, col - 1); c <= Math.min(COLS - 1, col + 1); c++) {
      const tc = grid[tr] ? grid[tr][c] : null;
      if (!tc) continue;
      if (tc.unit) {
        if (tr < 3 && cell.damage > 0) hl.push({ row: tr, col: c, color: 'rgba(255,40,40,0.6)', text: '-' + cell.damage });
        else if (tr >= 3) hl.push({ row: tr, col: c, color: 'rgba(255,255,0,0.5)', text: '' });
      } else hl.push({ row: tr, col: c, color: 'rgba(255,255,0,0.3)', text: '' });
    }
  }
  if (cell.heal > 0) for (let r = 1; r <= cell.attackRange; r++) {
    const tr = row + dir * r;
    if (tr < 0 || tr >= ROWS) break;
    for (let c = Math.max(0, col - 1); c <= Math.min(COLS - 1, col + 1); c++) {
      const tc = grid[tr] ? grid[tr][c] : null;
      if (tc && tc.unit && tr >= 3) hl.push({ row: tr, col: c, color: 'rgba(50,100,255,0.6)', text: '+' + cell.heal });
    }
  }
  return hl;
}

/* ====== АТАКА ЮНИТА ====== */
function unitAttack(row, col) {
  const cell = grid[row][col];
  if (!cell || !cell.unit) return;

  const dir = row >= 3 ? -1 : 1;
  let targetFound = false;

  for (let r = 1; r <= cell.attackRange; r++) {
    const tr = row + dir * r;
    if (tr < 0 || tr >= ROWS) break;
    for (let c = Math.max(0, col - 1); c <= Math.min(COLS - 1, col + 1); c++) {
      const tc = grid[tr]?.[c];
      if (!tc || !tc.unit) continue;
      const isEnemy = (row >= 3 && tr < 3) || (row < 3 && tr >= 3);
      if (!isEnemy) continue;

      tc.hp -= cell.damage;
      targetFound = true;
      highlightedCells.push({ row: tr, col: c, color: 'rgba(255, 40, 40, 0.8)', text: '-' + cell.damage });
      if (tc.hp <= 0) {
        tc.unit = null; tc.hp = 0; tc.maxHp = 0;
        tc.damage = 0; tc.attackRange = 0; tc.heal = 0; tc.cardData = null;
      }
      break;
    }
    if (targetFound) break;
  }

  if (cell.heal > 0 && row >= 3) {
    for (let r = 1; r <= cell.attackRange; r++) {
      const tr = row + dir * r;
      if (tr < 0 || tr >= ROWS) break;
      for (let c = Math.max(0, col - 1); c <= Math.min(COLS - 1, col + 1); c++) {
        const tc = grid[tr]?.[c];
        if (tc && tc.unit && tr >= 3) {
          const healAmount = cell.heal;
          const oldHp = tc.hp;
          tc.hp = Math.min(tc.maxHp, tc.hp + healAmount);
          const actualHeal = tc.hp - oldHp;
          if (actualHeal > 0) highlightedCells.push({ row: tr, col: c, color: 'rgba(50, 255, 100, 0.6)', text: '+' + actualHeal });
          break;
        }
      }
    }
  }

  if (currentMode === 'pvp') {
    saveMyField();
    syncAttack(row, col);
  }
}

function enemyAttack(row, col) {
  const cell = grid[row][col];
  if (!cell || !cell.unit || cell.damage <= 0) return;
  const dir = 1;
  let targetFound = false;
  for (let r = 1; r <= cell.attackRange; r++) {
    const tr = row + dir * r;
    if (tr < 0 || tr >= ROWS) break;
    for (let c = Math.max(0, col - 1); c <= Math.min(COLS - 1, col + 1); c++) {
      const tc = grid[tr]?.[c];
      if (!tc || !tc.unit) continue;
      tc.hp -= cell.damage;
      targetFound = true;
      highlightedCells.push({ row: tr, col: c, color: 'rgba(255,40,40,0.8)', text: '-' + cell.damage });
      if (tc.hp <= 0) {
        tc.unit = null; tc.hp = 0; tc.maxHp = 0;
        tc.damage = 0; tc.attackRange = 0; tc.heal = 0; tc.cardData = null;
      }
      break;
    }
    if (targetFound) break;
  }
}

function checkMoves() {
  let pm = 0, em = 0;
  for (let r = 3; r < 6; r++) for (let c = 0; c < COLS; c++)
    if (grid[r] && grid[r][c] && grid[r][c].unit && !grid[r][c].hasMovedThisRound) pm++;
  for (let r = 0; r < 3; r++) for (let c = 0; c < COLS; c++)
    if (grid[r] && grid[r][c] && grid[r][c].unit && !grid[r][c].hasMovedThisRound) em++;
  return { playerMoves: pm, enemyMoves: em };
}

function startPlacementPhase(fromRemote) {
  if (gameOver) return;
  gamePhase = 'placement';
  isPlayerTurn = false;
  lastTurnFlag = false;

  const elixirBonus = selectedHero ? (selectedHero.bonusElixir || 0) : 0;
  elixir = Math.min(MAX_ELIXIR, elixir + 5 + elixirBonus);

  selectedUnitRow = -1; selectedUnitCol = -1;
  highlightedCells = []; placementHighlights = [];
  updateElixirDisplay(); updatePhaseDisplay();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    if (grid[r] && grid[r][c]) grid[r][c].hasMovedThisRound = false;
  availableCards = shuffleArray(ALL_CARDS).slice(0, 5);
  purchasedCards = [];
  selectedPurchasedCard = null;
  renderCards();
  timerSeconds = 20;
  document.getElementById('game-timer').textContent = timerSeconds;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerSeconds--;
    document.getElementById('game-timer').textContent = timerSeconds;
    if (timerSeconds <= 0) { clearInterval(timerInterval); startBattlePhase(); }
  }, 1000);
  if (currentMode === 'pvp') {
    saveMyField();
    if (!fromRemote) syncStateToFB();
  }
}

function startBattlePhase() {
  if (gameOver) return;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  gamePhase = 'playerTurn';
  lastTurnFlag = false;
  battlePhaseCount++;
  const { playerMoves, enemyMoves } = checkMoves();
  if (currentMode === 'pvp') {
    if (pvpIsHost) isPlayerTurn = playerMoves > 0 && (Math.random() < 0.5 || enemyMoves === 0);
    else isPlayerTurn = false;
  } else {
    isPlayerTurn = playerMoves > 0 && (Math.random() < 0.5 || enemyMoves === 0);
  }
  selectedUnitRow = -1; selectedUnitCol = -1;
  highlightedCells = []; placementHighlights = [];
  updatePhaseDisplay();
  document.getElementById('game-timer').textContent = '';
  if (currentMode === 'pvp') syncStateToFB();

  if (!isPlayerTurn && currentMode !== 'pvp') {
    setTimeout(() => {
      executeEnemyTurn();
      setTimeout(() => processTurn(), 900);
    }, 700);
  }
}

function processTurn() {
  if (gameOver) return;
  checkBaseAttacks();
  if (gameOver) return;

  const { playerMoves, enemyMoves } = checkMoves();

  if (playerMoves === 0 && enemyMoves === 0) { startPlacementPhase(); return; }

  if (playerMoves === 0 || enemyMoves === 0) {
    if (playerMoves > 0) {
      isPlayerTurn = true;
      lastTurnFlag = true;
      updatePhaseDisplay();
      if (currentMode === 'pvp') syncStateToFB({ isLastTurn: true });
      return;
    }
    isPlayerTurn = false;
    lastTurnFlag = false;
    updatePhaseDisplay();
    if (currentMode === 'pvp') {
      syncStateToFB({ isLastTurn: true });
    } else {
      setTimeout(() => {
        executeEnemyTurn();
        setTimeout(() => {
          checkBaseAttacks();
          if (gameOver) return;
          startPlacementPhase();
        }, 900);
      }, 600);
    }
    return;
  }

  isPlayerTurn = !isPlayerTurn;
  updatePhaseDisplay();
  if (currentMode === 'pvp') syncStateToFB();

  if (!isPlayerTurn && currentMode !== 'pvp') {
    setTimeout(() => {
      executeEnemyTurn();
      setTimeout(() => processTurn(), 900);
    }, 700);
  }
}

function executeEnemyTurn() {
  if (gameOver) return;
  const enemyUnits = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < COLS; c++)
    if (grid[r][c] && grid[r][c].unit && !grid[r][c].hasMovedThisRound) enemyUnits.push({ row: r, col: c });
  if (enemyUnits.length > 0) {
    const unit = enemyUnits[Math.floor(Math.random() * enemyUnits.length)];
    grid[unit.row][unit.col].hasMovedThisRound = true;
    enemyAttack(unit.row, unit.col);
    setTimeout(() => { highlightedCells = []; }, 1500);
  }
}

/* ====== ОТРИСОВКА ГЕРОЯ (аватар с круглой рамкой) ====== */
function drawHeroBadge(cx, cy, radius, hero, isEnemy) {
  // Свечение
  ctx.beginPath();
  ctx.arc(cx, cy, radius + 3, 0, Math.PI * 2);
  ctx.fillStyle = isEnemy ? 'rgba(255,70,70,0.18)' : 'rgba(77,150,255,0.18)';
  ctx.fill();

  // Фон круга
  const grad = ctx.createRadialGradient(cx - radius * 0.35, cy - radius * 0.35, radius * 0.1, cx, cy, radius);
  grad.addColorStop(0, isEnemy ? 'rgba(255,130,130,0.55)' : 'rgba(130,190,255,0.55)');
  grad.addColorStop(1, 'rgba(8,10,26,0.95)');
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Картинка героя (если есть) — рисуем в обрезанном круге
  let drewImage = false;
  if (hero && hero.image) {
    const rec = loadImage(hero.image);
    if (rec && rec.loaded && !rec.failed) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, radius - 1.5, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(rec.img, cx - radius, cy - radius, radius * 2, radius * 2);
      ctx.restore();
      drewImage = true;
    }
  }

  // Эмодзи — если картинки нет
  if (!drewImage) {
    ctx.font = Math.round(radius * 1.15) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(hero ? hero.emoji : '👤', cx, cy + radius * 0.06);
  }

  // Рамка
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = isEnemy ? '#ff5555' : '#4d96ff';
  ctx.stroke();
}

function drawHearts(rightX, y, hp, maxHp, size) {
  ctx.font = size + 'px Arial';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  let s = '';
  for (let i = 0; i < maxHp; i++) s += (i < hp ? '❤️' : '🖤');
  ctx.fillText(s, rightX, y);
}

/* ====== ОТРИСОВКА ИГРОКОВ ====== */
function drawBases() {
  const radius = Math.max(13, Math.min(18, BASE_AREA_H * 0.37));
  const avatarCx = canvas.width - 10 - radius;
  const heartsRightX = avatarCx - radius - 8;
  const heartSize = Math.min(17, BASE_AREA_H * 0.42);

  const eY = BASE_AREA_H / 2;
  const pY = canvas.height - BASE_AREA_H / 2;

  drawHearts(heartsRightX, eY, enemyBaseHp, enemyMaxBaseHp, heartSize);
  drawHeroBadge(avatarCx, eY, radius, enemyHero, true);

  drawHearts(heartsRightX, pY, playerBaseHp, playerMaxBaseHp, heartSize);
  drawHeroBadge(avatarCx, pY, radius, selectedHero, false);

  if (baseAttackAnim) {
    const elapsed = Date.now() - baseAttackAnim.startTime;
    if (elapsed < 1200) {
      const alpha = Math.max(0, 1 - elapsed / 1200);
      const y = baseAttackAnim.target === 'enemy' ? eY : pY;
      ctx.globalAlpha = alpha;
      ctx.font = 'bold ' + Math.round(radius * 1.5) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#000';
      ctx.fillStyle = '#ff3b3b';
      ctx.strokeText('-1', avatarCx, y);
      ctx.fillText('-1', avatarCx, y);
      ctx.globalAlpha = 1;
    } else {
      baseAttackAnim = null;
    }
  }
}

/* ====== ОТРИСОВКА ЮНИТА В КЛЕТКЕ (картинка или эмодзи) ====== */
function drawUnitInCell(cell, x, y) {
  let drew = false;
  if (cell.cardData && cell.cardData.image) {
    const rec = loadImage(cell.cardData.image);
    if (rec && rec.loaded && !rec.failed) {
      const imgSize = cellSize * 0.72;
      const imgX = x + (cellSize - imgSize) / 2;
      const imgY = y + cellSize * 0.06;
      ctx.drawImage(rec.img, imgX, imgY, imgSize, imgSize);
      drew = true;
    }
  }
  if (!drew) {
    ctx.fillStyle = '#fff';
    ctx.font = (cellSize * 0.35) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cell.unit, x + cellSize / 2, y + cellSize / 2 - cellSize * 0.1);
  }
}

function drawGrid() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawBases();

  const cr = cellSize * 0.1, gapBetween = 10;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!grid[r] || !grid[r][c]) continue;
      const x = gridOffsetX + c * (cellSize + gapBetween);
      const y = gridOffsetY + r * (cellSize + gapBetween);
      const cell = grid[r][c];

      ctx.fillStyle = cell.color;
      ctx.beginPath();
      ctx.roundRect(x, y, cellSize, cellSize, cr);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x + 1, y + 1, cellSize - 2, cellSize - 2, cr);
      ctx.stroke();

      if (r === selectedUnitRow && c === selectedUnitCol) {
        ctx.fillStyle = 'rgba(255,215,0,0.3)';
        ctx.beginPath();
        ctx.roundRect(x + 1, y + 1, cellSize - 2, cellSize - 2, cr);
        ctx.fill();
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      if (cell.unit && !cell.hasMovedThisRound && gamePhase === 'playerTurn' && isPlayerTurn && r >= 3) {
        ctx.fillStyle = lastTurnFlag ? 'rgba(255,100,255,0.35)' : 'rgba(255,255,100,0.3)';
        ctx.beginPath();
        ctx.roundRect(x + 1, y + 1, cellSize - 2, cellSize - 2, cr);
        ctx.fill();
      }

      if (cell.unit) {
        drawUnitInCell(cell, x, y);
        const bw = cellSize * 0.75, bh = 4;
        const bx = x + (cellSize - bw) / 2, by = y + cellSize - 7;
        ctx.fillStyle = '#333';
        ctx.fillRect(bx, by, bw, bh);
        const pct = cell.hp / cell.maxHp;
        ctx.fillStyle = pct > 0.5 ? '#4caf50' : pct > 0.25 ? '#ff9800' : '#f44336';
        ctx.fillRect(bx, by, bw * pct, bh);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold ' + Math.max(6, cellSize * 0.16) + 'px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(Math.ceil(cell.hp) + '/' + cell.maxHp, x + cellSize / 2, y + cellSize - 10);
      }
    }
  }

  placementHighlights.forEach(h => {
    const x = gridOffsetX + h.col * (cellSize + gapBetween);
    const y = gridOffsetY + h.row * (cellSize + gapBetween);
    ctx.fillStyle = h.color;
    ctx.beginPath();
    ctx.roundRect(x + 2, y + 2, cellSize - 4, cellSize - 4, cr);
    ctx.fill();
    ctx.strokeStyle = 'rgba(50,255,50,0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  highlightedCells.forEach(h => {
    const x = gridOffsetX + h.col * (cellSize + gapBetween);
    const y = gridOffsetY + h.row * (cellSize + gapBetween);
    ctx.fillStyle = h.color;
    ctx.beginPath();
    ctx.roundRect(x + 2, y + 2, cellSize - 4, cellSize - 4, cr);
    ctx.fill();
    ctx.strokeStyle = h.color.replace('0.6', '0.9').replace('0.5', '0.8').replace('0.3', '0.6');
    ctx.lineWidth = 2;
    ctx.stroke();
    if (h.text) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + Math.max(12, cellSize * 0.35) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeText(h.text, x + cellSize / 2, y + cellSize / 2);
      ctx.fillText(h.text, x + cellSize / 2, y + cellSize / 2);
    }
  });
}

/* ====== PVP СИНХРОНИЗАЦИЯ ====== */
function saveMyField() {
  if (!pvpRoom) return;
  const myUnits = [];
  for (let r = 3; r < 6; r++) {
    myUnits[r - 3] = [];
    for (let c = 0; c < COLS; c++) {
      const cell = grid[r][c];
      myUnits[r - 3][c] = cell.unit ? {
        u: cell.unit, h: cell.hp, mh: cell.maxHp,
        d: cell.damage, ar: cell.attackRange,
        heal: cell.heal || 0, hm: cell.hasMovedThisRound,
        img: cell.cardData ? (cell.cardData.image || null) : null
      } : null;
    }
  }
  const enemyHp = [];
  for (let r = 0; r < 3; r++) {
    enemyHp[r] = [];
    for (let c = 0; c < COLS; c++) {
      const cell = grid[r][c];
      enemyHp[r][c] = { h: cell.unit ? cell.hp : 0, alive: !!cell.unit && cell.hp > 0 };
    }
  }
  set(ref(db, 'pvp_fields/' + pvpRoom + '/' + playerId), { myUnits, enemyHp });
}

function watchOpponentField() {
  if (!pvpRoom || !pvpOpponentId) return;
  onValue(ref(db, 'pvp_fields/' + pvpRoom + '/' + pvpOpponentId), (snap) => {
    const data = snap.val();
    if (!data) return;

    if (data.myUnits) {
      for (let r = 0; r < 3; r++) {
        if (!data.myUnits[r]) continue;
        for (let c = 0; c < COLS; c++) {
          const myRow = 2 - r, myCol = 3 - c;
          const unitData = data.myUnits[r][c];
          if (unitData && unitData.u) {
            if (!grid[myRow]) grid[myRow] = [];
            if (!grid[myRow][myCol]) grid[myRow][myCol] = {
              color: '#ff4444', unit: null, hp: 0, maxHp: 0,
              damage: 0, attackRange: 0, heal: 0, hasMovedThisRound: false, cardData: null
            };
            grid[myRow][myCol].unit = unitData.u;
            grid[myRow][myCol].hp = unitData.h;
            grid[myRow][myCol].maxHp = unitData.mh;
            grid[myRow][myCol].damage = unitData.d;
            grid[myRow][myCol].attackRange = unitData.ar;
            grid[myRow][myCol].heal = unitData.heal || 0;
            grid[myRow][myCol].hasMovedThisRound = !!unitData.hm;
            grid[myRow][myCol].cardData = { image: unitData.img || null, emoji: unitData.u, name: 'Враг' };
          } else {
            if (grid[myRow] && grid[myRow][myCol] && grid[myRow][myCol].unit) {
              grid[myRow][myCol].unit = null;
              grid[myRow][myCol].hp = 0;
              grid[myRow][myCol].maxHp = 0;
              grid[myRow][myCol].damage = 0;
              grid[myRow][myCol].attackRange = 0;
              grid[myRow][myCol].heal = 0;
              grid[myRow][myCol].cardData = null;
            }
          }
        }
      }
    }

    if (data.enemyHp) {
      for (let r = 0; r < 3; r++) {
        if (!data.enemyHp[r]) continue;
        for (let c = 0; c < COLS; c++) {
          const myRow = 5 - r, myCol = 3 - c;
          const hpData = data.enemyHp[r][c];
          if (!hpData) continue;
          const myCell = grid[myRow] && grid[myRow][myCol];
          if (!myCell) continue;
          if (!hpData.alive || hpData.h <= 0) {
            if (myCell.unit) {
              myCell.unit = null;
              myCell.hp = 0;
              myCell.maxHp = 0;
              myCell.damage = 0;
              myCell.attackRange = 0;
              myCell.heal = 0;
              myCell.cardData = null;
            }
          } else if (myCell.unit && myCell.hp !== hpData.h) {
            myCell.hp = hpData.h;
          }
        }
      }
    }
  });
}

function syncStateToFB(extra) {
  if (!pvpRoom) return;
  const payload = {
    phase: gamePhase,
    isPlayerTurn,
    currentPlayer: isPlayerTurn ? playerId : pvpOpponentId,
    battlePhase: battlePhaseCount
  };
  if (extra) Object.assign(payload, extra);
  set(ref(db, 'rooms/' + pvpRoom + '/state'), payload);
}

function syncAttack(row, col) {
  if (!pvpRoom) return;
  set(ref(db, 'rooms/' + pvpRoom + '/attack'), { from: playerId, time: Date.now() });
}

function syncHero() {
  if (!pvpRoom) return;
  set(ref(db, 'rooms/' + pvpRoom + '/heroes/' + playerId), selectedHero ? selectedHero.id : DEFAULT_HERO.id);
}

function watchHeroes() {
  if (!pvpRoom || !pvpOpponentId) return;
  onValue(ref(db, 'rooms/' + pvpRoom + '/heroes/' + pvpOpponentId), (snap) => {
    const id = snap.val();
    if (!id) return;
    const h = heroById(id);
    if (h) {
      enemyHero = h;
      enemyMaxBaseHp = computeMaxBaseHp(h);
    }
  });
}

function watchGameState() {
  if (!pvpRoom) return;
  onValue(ref(db, 'rooms/' + pvpRoom + '/state'), (snap) => {
    const s = snap.val();
    if (!s) return;
    if (typeof s.battlePhase === 'number' && s.battlePhase > battlePhaseCount) battlePhaseCount = s.battlePhase;
    if (s.phase === 'placement' && gamePhase !== 'placement') { startPlacementPhase(true); return; }
    if (s.currentPlayer === playerId) {
      gamePhase = s.phase;
      isPlayerTurn = true;
      lastTurnFlag = !!s.isLastTurn;
    } else {
      gamePhase = s.phase;
      isPlayerTurn = false;
      lastTurnFlag = false;
    }
    updatePhaseDisplay();
  });
}

function watchOpponentAttack() {
  if (!pvpRoom) return;
  onValue(ref(db, 'rooms/' + pvpRoom + '/attack'), (snap) => {
    const a = snap.val();
    if (!a || a.from === playerId || Date.now() - a.time > 3000) return;
    saveMyField();
  });
}

function dealBaseDamage(targetPlayerId) {
  if (!pvpRoom || !targetPlayerId) return;
  const path = 'pvp_base_hp/' + pvpRoom + '/' + targetPlayerId;
  get(ref(db, path)).then(snap => {
    const cur = snap.val();
    const curVal = (cur === null || cur === undefined) ? MAX_BASE_HP : cur;
    if (curVal > 0) set(ref(db, path), curVal - 1);
  });
}

function watchBaseHp() {
  if (!pvpRoom) return;
  if (pvpHpUnsub1) pvpHpUnsub1();
  if (pvpHpUnsub2) pvpHpUnsub2();

  pvpHpUnsub1 = onValue(ref(db, 'pvp_base_hp/' + pvpRoom + '/' + playerId), (snap) => {
    const v = snap.val();
    if (v !== null && v !== undefined) {
      playerBaseHp = v;
      if (playerBaseHp <= 0 && !gameOver) { gameOver = true; setTimeout(() => endGame('enemy'), 600); }
    }
  });

  pvpHpUnsub2 = onValue(ref(db, 'pvp_base_hp/' + pvpRoom + '/' + pvpOpponentId), (snap) => {
    const v = snap.val();
    if (v !== null && v !== undefined) {
      enemyBaseHp = v;
      if (enemyBaseHp <= 0 && !gameOver) { gameOver = true; setTimeout(() => endGame('player'), 600); }
    }
  });
}

/* ====== PVP ПОИСК ====== */
function startPvP() {
  document.getElementById('pvp-waiting').classList.add('active');
  let resolved = false;

  const unsubSignal = onValue(ref(db, 'pvp_signals/' + playerId), (snap) => {
    if (resolved || pvpRoom) return;
    const sig = snap.val();
    if (sig && sig.roomId) {
      resolved = true;
      pvpRoom = sig.roomId;
      pvpOpponentId = sig.hostId;
      pvpIsHost = false;
      remove(ref(db, 'pvp_signals/' + playerId));
      remove(ref(db, 'pvp_queue/' + playerId));
      unsubSignal();
      initGrid(true);
      document.getElementById('pvp-waiting').classList.remove('active');
      startGame();
      setTimeout(() => {
        watchOpponentField(); watchGameState(); watchOpponentAttack(); watchBaseHp(); watchHeroes();
      }, 500);
    }
  });

  set(ref(db, 'pvp_queue/' + playerId), { playerId, time: Date.now() });

  setTimeout(() => {
    if (resolved || pvpRoom) return;
    const unsubQueue = onValue(ref(db, 'pvp_queue'), (snap) => {
      if (resolved || pvpRoom) return;
      const data = snap.val();
      if (!data) return;
      const others = Object.entries(data).filter(([key]) => key !== playerId);
      if (others.length > 0) {
        resolved = true;
        const [oppKey] = others[0];
        pvpRoom = 'room_' + Date.now();
        pvpOpponentId = oppKey;
        pvpIsHost = true;
        remove(ref(db, 'pvp_queue/' + playerId));
        remove(ref(db, 'pvp_queue/' + oppKey));
        unsubQueue();
        initGrid(true);
        set(ref(db, 'pvp_signals/' + oppKey), { roomId: pvpRoom, hostId: playerId });
        document.getElementById('pvp-waiting').classList.remove('active');
        startGame();
        setTimeout(() => {
          watchOpponentField(); watchGameState(); watchOpponentAttack(); watchBaseHp(); watchHeroes();
        }, 500);
      }
    });
  }, 2000);

  setTimeout(() => {
    if (!resolved && document.getElementById('pvp-waiting').classList.contains('active')) {
      remove(ref(db, 'pvp_queue/' + playerId));
      remove(ref(db, 'pvp_signals/' + playerId));
      document.getElementById('pvp-waiting').classList.remove('active');
      alert('Соперник не найден');
    }
  }, 30000);
}

/* ====== СТАРТ ИГРЫ ====== */
function startGame() {
  lobby.style.display = 'none';
  lobby.classList.remove('active');
  gameScreen.classList.add('active');

  playerMaxBaseHp = computeMaxBaseHp(selectedHero);
  enemyMaxBaseHp = computeMaxBaseHp(enemyHero);

  playerBaseHp = playerMaxBaseHp;
  enemyBaseHp = enemyMaxBaseHp;
  gameOver = false;
  baseAttackAnim = null;
  battlePhaseCount = 0;
  document.getElementById('game-over-modal').classList.remove('active');

  elixir = 5;
  selectedUnitRow = -1; selectedUnitCol = -1;
  highlightedCells = []; placementHighlights = [];
  lastTurnFlag = false;

  if (currentMode === 'pvp' && pvpRoom) {
    set(ref(db, 'pvp_base_hp/' + pvpRoom + '/' + playerId), playerMaxBaseHp);
    syncHero();
  }

  startPlacementPhase();
  setTimeout(resizeCanvas, 300);
  if (gameLoopId) cancelAnimationFrame(gameLoopId);
  gameLoop();
}

function gameLoop() {
  drawGrid();
  gameLoopId = requestAnimationFrame(gameLoop);
}

function showLobby() {
  lobby.classList.add('active');
  lobby.style.display = 'flex';
}

/* ====== ОБРАБОТЧИКИ ====== */
document.getElementById('play-button').onclick = () => {
  if (currentMode === 'classic') {
    enemyHero = ALL_HEROES[Math.floor(Math.random() * ALL_HEROES.length)];
    initGrid(false);
    startGame();
  } else if (currentMode === 'pvp') {
    startPvP();
  }
};

document.getElementById('mode-button').onclick = () => openModePage();
document.getElementById('mode-page-back').onclick = () => closeModePage();

document.getElementById('pvp-cancel').onclick = () => {
  remove(ref(db, 'pvp_queue/' + playerId));
  remove(ref(db, 'pvp_signals/' + playerId));
  document.getElementById('pvp-waiting').classList.remove('active');
};

function cleanupGame() {
  if (timerInterval) clearInterval(timerInterval);
  if (gameLoopId) cancelAnimationFrame(gameLoopId);
  if (attackAnimationTimeout) clearTimeout(attackAnimationTimeout);
  if (pvpHpUnsub1) { pvpHpUnsub1(); pvpHpUnsub1 = null; }
  if (pvpHpUnsub2) { pvpHpUnsub2(); pvpHpUnsub2 = null; }
  if (pvpRoom) {
    remove(ref(db, 'pvp_fields/' + pvpRoom));
    remove(ref(db, 'rooms/' + pvpRoom));
    remove(ref(db, 'pvp_base_hp/' + pvpRoom));
    pvpRoom = null; pvpOpponentId = null;
  }
  gameOver = false;
  baseAttackAnim = null;
  battlePhaseCount = 0;
  document.getElementById('game-over-modal').classList.remove('active');
}

document.getElementById('back-button').onclick = () => {
  cleanupGame();
  gameScreen.classList.remove('active');
  showLobby();
};

document.getElementById('game-over-btn').onclick = () => {
  document.getElementById('game-over-modal').classList.remove('active');
  cleanupGame();
  gameScreen.classList.remove('active');
  showLobby();
};

document.getElementById('nav-home').onclick = () => {
  document.getElementById('home-page').style.display = 'flex';
  document.getElementById('cards-page').classList.remove('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-home').classList.add('active');
};

document.getElementById('nav-cards').onclick = () => {
  document.getElementById('home-page').style.display = 'none';
  document.getElementById('cards-page').classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-cards').classList.add('active');
  renderAllCardsPage();
  renderHeroesPage();
};

/* ====== ВКЛАДКИ ====== */
document.getElementById('tab-all-cards').onclick = () => {
  document.getElementById('tab-all-cards').classList.add('active');
  document.getElementById('tab-heroes').classList.remove('active');
  document.getElementById('all-cards-section').style.display = 'block';
  document.getElementById('heroes-section').style.display = 'none';
  renderAllCardsPage();
};
document.getElementById('tab-heroes').onclick = () => {
  document.getElementById('tab-heroes').classList.add('active');
  document.getElementById('tab-all-cards').classList.remove('active');
  document.getElementById('all-cards-section').style.display = 'none';
  document.getElementById('heroes-section').style.display = 'block';
  renderHeroesPage();
};

/* ====== КЛИК ПО ПОЛЮ ====== */
canvas.onclick = e => {
  if (gameOver) return;
  if (!gameScreen.classList.contains('active')) return;

  const rect = canvas.getBoundingClientRect();
  if (rect.width === 0) return;

  const mx = e.clientX - rect.left, my = e.clientY - rect.top, gapBetween = 10;
  const col = Math.floor((mx - gridOffsetX) / (cellSize + gapBetween));
  const row = Math.floor((my - gridOffsetY) / (cellSize + gapBetween));

  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) {
    if (gamePhase === 'playerTurn') {
      selectedUnitRow = -1; selectedUnitCol = -1; highlightedCells = [];
    }
    return;
  }

  if (gamePhase === 'placement') {
    if (row >= 3 && selectedPurchasedCard && !grid[row][col].unit) {
      const card = selectedPurchasedCard.card;
      const hpBonus = selectedHero ? (selectedHero.bonusHp || 0) : 0;
      const dmgBonus = selectedHero ? (selectedHero.bonusDmg || 0) : 0;
      grid[row][col].unit = card.emoji;
      grid[row][col].hp = card.hp + hpBonus;
      grid[row][col].maxHp = card.maxHp + hpBonus;
      grid[row][col].damage = card.damage + dmgBonus;
      grid[row][col].attackRange = card.attackRange;
      grid[row][col].heal = card.heal || 0;
      grid[row][col].cardData = card;
      purchasedCards.splice(selectedPurchasedCard.index, 1);
      selectedPurchasedCard = null;
      placementHighlights = [];
      renderCards();
      if (currentMode === 'pvp') saveMyField();
    }
    return;
  }

  if (gamePhase === 'playerTurn' && isPlayerTurn) {
    const cell = grid[row][col];
    if (row >= 3 && cell && cell.unit && !cell.hasMovedThisRound) {
      if (selectedUnitRow === row && selectedUnitCol === col) {
        cell.hasMovedThisRound = true;
        const attackTargets = calculateHighlights(row, col);
        highlightedCells = attackTargets;
        if (attackAnimationTimeout) clearTimeout(attackAnimationTimeout);
        attackAnimationTimeout = setTimeout(() => {
          unitAttack(row, col);
          setTimeout(() => {
            selectedUnitRow = -1; selectedUnitCol = -1;
            highlightedCells = [];
            if (currentMode === 'pvp') saveMyField();
            if (battlePhaseCount > 1) {
              if (currentMode === 'pvp' && isFieldEmpty(0, 3) && enemyBaseHp > 0) {
                enemyBaseHp--;
                baseAttackAnim = { target: 'enemy', startTime: Date.now() };
                dealBaseDamage(pvpOpponentId);
                if (enemyBaseHp <= 0) { gameOver = true; setTimeout(() => endGame('player'), 800); return; }
              }
            }
            if (lastTurnFlag) { lastTurnFlag = false; startPlacementPhase(); }
            else { processTurn(); }
          }, 600);
        }, 300);
      } else {
        selectedUnitRow = row; selectedUnitCol = col;
        highlightedCells = calculateHighlights(row, col);
      }
    } else {
      selectedUnitRow = -1; selectedUnitCol = -1; highlightedCells = [];
    }
  }
};

document.getElementById('menu-toggle').onclick = () => {
  const m = document.getElementById('settings-menu');
  const o = document.getElementById('settings-overlay');
  const t = document.getElementById('menu-toggle');
  m.classList.toggle('active');
  o.classList.toggle('active');
  t.classList.toggle('active');
};
document.getElementById('settings-overlay').onclick = () => {
  document.getElementById('settings-menu').classList.remove('active');
  document.getElementById('settings-overlay').classList.remove('active');
  document.getElementById('menu-toggle').classList.remove('active');
};

/* ====== РЕСАЙЗ ====== */
function resizeCanvas() {
  const cont = document.getElementById('game-container');
  const ca = document.getElementById('cards-area');
  if (!cont || !ca) return;
  const rect = cont.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) { requestAnimationFrame(resizeCanvas); return; }
  const ch = ca.offsetHeight || 120, ah = rect.height - 38 - ch;
  canvas.width = rect.width;
  canvas.height = Math.max(200, ah);
  const gridTop = BASE_AREA_H + 6;
  const gridBottom = canvas.height - BASE_AREA_H - 6;
  const gridAreaH = Math.max(100, gridBottom - gridTop);
  const gapBetween = 10, gapEdge = 10;
  const maxW = (canvas.width - gapBetween * (COLS - 1) - gapEdge * 2) / COLS;
  const maxH = (gridAreaH - gapBetween * (ROWS - 1) - gapEdge * 2) / ROWS;
  cellSize = Math.floor(Math.max(14, Math.min(maxW, maxH)));
  gridOffsetX = Math.floor((canvas.width - cellSize * COLS - gapBetween * (COLS - 1)) / 2);
  gridOffsetY = Math.floor(gridTop + (gridAreaH - cellSize * ROWS - gapBetween * (ROWS - 1)) / 2);
}

window.addEventListener('resize', () => {
  if (gameScreen.classList.contains('active')) resizeCanvas();
});
window.addEventListener('orientationchange', () => {
  if (gameScreen.classList.contains('active')) setTimeout(resizeCanvas, 500);
});

/* ====== ИНИЦИАЛИЗАЦИЯ ====== */
preloadAllImages();
updateModeLabel();

let progress = 0;
const loadInterval = setInterval(() => {
  progress += Math.random() * 15;
  if (progress >= 100) {
    progress = 100;
    clearInterval(loadInterval);
    setTimeout(() => {
      preloader.classList.add('hidden');
      setTimeout(() => { preloader.style.display = 'none'; showLobby(); }, 800);
    }, 500);
  }
  loadingBar.style.width = Math.floor(progress) + '%';
  loadingPercentage.textContent = Math.floor(progress) + '%';
}, 300);
</script>
